<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OMNI container explorer</title>
<!--
  Generated by tools/build-explorer.py from examples/toy.omni. Do not edit by
  hand: every offset, digest and byte here was read out of the real container by
  the real tool, and CI diffs this file against a fresh generation.

  No dependencies, no network, no build step — one file that opens from disk, for
  the same reason the reference implementation has no dependencies.
-->
<style>
  :root {
    --bg:#0b0d12; --panel:#12151c; --line:#232833; --ink:#c9d2e0; --dim:#6b7688;
    --hi:#e8eef8;
    --seg-super:#6366f1; --seg-obj:#22d3ee; --seg-blob:#f59e0b; --seg-index:#a3e635;
    --seg-pad:#2a3040;
    --t-manifest:#818cf8; --t-meta:#f472b6; --t-model:#34d399; --t-table:#facc15;
    --t-desc:#22d3ee; --t-chunk:#fb923c; --t-blob:#94a3b8;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:13px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  body { display:flex; flex-direction:column; overflow:hidden; }

  header { padding:10px 16px 8px; border-bottom:1px solid var(--line); flex:0 0 auto; }
  h1 { margin:0; font-size:14px; font-weight:600; letter-spacing:.02em; color:var(--hi); }
  h1 small { color:var(--dim); font-weight:400; margin-left:10px; letter-spacing:0; }

  /* ---- the file, to scale ------------------------------------------------ */
  #map { display:flex; height:34px; margin:10px 16px 4px; flex:0 0 auto;
    border:1px solid var(--line); border-radius:3px; overflow:hidden; cursor:pointer; }
  #map div { position:relative; display:flex; align-items:center; justify-content:center;
    font-size:10px; color:#0b0d12; font-weight:700; letter-spacing:.06em;
    transition:filter .12s, transform .12s; overflow:hidden; white-space:nowrap; }
  #map div:hover { filter:brightness(1.25); }
  #map div.on { box-shadow:inset 0 0 0 2px var(--hi); }
  .k-SUPER{background:var(--seg-super)} .k-OBJ{background:var(--seg-obj)}
  .k-BLOB{background:var(--seg-blob)} .k-INDEX{background:var(--seg-index)}
  .k-PAD{background:var(--seg-pad); color:var(--dim)}
  #scale { display:flex; justify-content:space-between; margin:0 16px 10px;
    font-size:10px; color:var(--dim); flex:0 0 auto; }

  /* ---- three panes ------------------------------------------------------- */
  main { flex:1 1 auto; display:grid; grid-template-columns:300px 1.2fr 1fr; gap:10px;
    padding:0 16px 12px; min-height:0; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:4px;
    display:flex; flex-direction:column; min-height:0; }
  section > h2 { margin:0; padding:7px 10px; font-size:11px; font-weight:600;
    letter-spacing:.08em; text-transform:uppercase; color:var(--dim);
    border-bottom:1px solid var(--line); flex:0 0 auto; }
  .body { overflow:auto; padding:8px 10px; flex:1 1 auto; }

  /* ---- the object graph -------------------------------------------------- */
  #graph .body { padding:6px 8px; }
  .node { display:flex; align-items:baseline; gap:6px; padding:2px 6px; border-radius:3px;
    cursor:pointer; white-space:nowrap; }
  .node:hover { background:#1b2030; }
  .node.on { background:#243049; box-shadow:inset 0 0 0 1px #3b4a6b; }
  .node .dot { width:7px; height:7px; border-radius:50%; flex:0 0 auto; }
  .node .ty { color:var(--hi); }
  .node .nm { color:#8fa3c0; overflow:hidden; text-overflow:ellipsis; }
  .node .dg { color:#475569; margin-left:auto; padding-left:8px; }
  .kids { margin-left:13px; border-left:1px solid var(--line); padding-left:5px; }
  .dot-Manifest{background:var(--t-manifest)} .dot-Metadata{background:var(--t-meta)}
  .dot-Model{background:var(--t-model)} .dot-TensorTable{background:var(--t-table)}
  .dot-TensorDesc{background:var(--t-desc)} .dot-ChunkList{background:var(--t-chunk)}
  .dot-Blob{background:var(--t-blob)}
  .fold { color:var(--dim); cursor:pointer; user-select:none; width:9px; flex:0 0 auto; }

  /* ---- hex --------------------------------------------------------------- */
  #hex .body { font-size:11px; line-height:1.6; }
  .row { display:flex; gap:9px; white-space:nowrap; }
  .row .o { color:#475569; flex:0 0 auto; }
  .row .b { letter-spacing:.4px; flex:0 0 auto; }
  .row .a { color:var(--dim); flex:0 0 auto; }
  .hl { background:#3b4a6b; color:var(--hi); border-radius:2px; }
  .hl2 { background:#4a3b6b; color:var(--hi); border-radius:2px; }
  #legend { padding:6px 10px; border-top:1px solid var(--line); font-size:10.5px;
    color:var(--dim); flex:0 0 auto; }
  #legend b { color:var(--ink); font-weight:600; }

  /* ---- inspector --------------------------------------------------------- */
  #info .body { font-size:12px; }
  table.kv { width:100%; border-collapse:collapse; }
  table.kv td { padding:1px 0; vertical-align:top; }
  table.kv td:first-child { color:var(--dim); width:78px; padding-right:8px; }
  .cbor { margin:8px 0 0; white-space:pre-wrap; overflow-wrap:anywhere; color:#a5d6ff;
    font-size:11.5px; }
  .cbor .key { color:#7dd3fc; } .cbor .num { color:#fca5a5; }
  .cbor .dig { color:#c4b5fd; } .cbor .str { color:#86efac; }
  .pill { display:inline-block; padding:0 5px; border-radius:8px; font-size:10px;
    background:#243049; color:var(--ink); margin-right:4px; }
  .note { color:var(--dim); margin-top:8px; font-size:11px; }
  .sec { color:#818cf8; }

  /* ---- the ladder -------------------------------------------------------- */
  #ladder { margin:0 16px 10px; flex:0 0 auto; background:var(--panel);
    border:1px solid var(--line); border-radius:4px; padding:6px 10px;
    font-size:11px; display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
  #ladder b { color:var(--dim); font-weight:600; letter-spacing:.06em; }
  .v { color:#334155; transition:color .2s; }
  .v.ok { color:#4ade80; }

  /* the scripted pointer, for the recording */
  #cursor { position:fixed; width:14px; height:14px; margin:-7px 0 0 -7px;
    border-radius:50%; border:2px solid #fff; background:rgba(255,255,255,.25);
    pointer-events:none; opacity:0; transition:opacity .2s; z-index:99;
    box-shadow:0 0 0 1px rgba(0,0,0,.6); }
  #cursor.down { transform:scale(.7); background:rgba(255,255,255,.7); }
</style>
</head>
<body>
<header>
  <h1>OMNI container explorer
    <small id="sub"></small></h1>
</header>

<div id="map" title="the file, to scale — click a segment"></div>
<div id="scale"><span>0x00000000</span><span id="mid"></span><span id="end"></span></div>

<div id="ladder"><b>VALIDATION</b></div>

<main>
  <section id="graph">
    <h2>Object graph · from the root</h2>
    <div class="body" id="tree"></div>
  </section>
  <section id="hex">
    <h2>Bytes <span id="hexwhere" style="color:var(--dim);font-weight:400"></span></h2>
    <div class="body" id="hexbody"></div>
    <div id="legend"></div>
  </section>
  <section id="info">
    <h2>Inspector</h2>
    <div class="body" id="infobody"></div>
  </section>
</main>

<div id="cursor"></div>

<script>
/*DATA*/

const $ = (s) => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
  if (x !== undefined) n.textContent = x; return n; };
const hexAt = (off, n) => OMNI.hex.slice(off * 2, (off + n) * 2);
const short = (d) => d.slice(0, 12) + '…';
const kib = (n) => n >= 1024 ? (n / 1024).toFixed(n >= 10240 ? 0 : 1) + ' KiB' : n + ' B';

// The dot already carries the type in colour, so the word next to it can be the
// short form and leave the width for the tensor's name. The full type is in the
// inspector.
const SHORT = { TensorTable: 'Table', TensorDesc: 'Desc', ChunkList: 'Chunks' };

// A tree 300px wide cannot hold `model.layers.0.attn.q_proj.weight`, and cutting
// it from either end loses the part that distinguishes it from the other eleven.
// So it is compacted, not truncated — the full name is in the inspector, which
// has room for it.
const label = (n) => n
  .replace(/^model\.layers\.(\d+)\./, 'L$1 ')
  .replace(/^model\./, '')
  .replace(/\.weight$/, '');

const byDigest = {};
for (const o of OMNI.objects) byDigest[o.digest] = o;

$('#sub').textContent =
  `${OMNI.file} · ${kib(OMNI.size)} · ${OMNI.objects.length} objects · `
  + `blake3-256 · root ${short(OMNI.root)}`;
$('#mid').textContent = kib(OMNI.size) + ' total';
$('#end').textContent = '0x' + OMNI.size.toString(16).padStart(8, '0');

// ---- the file map, proportional ------------------------------------------
// The header is not a segment (§02.3) but it is 128 real bytes at offset 0, so
// it gets a slot; likewise the trailer. Widths are the true byte counts, which is
// why PAD looks as big as it does — that is what alignment costs.
const parts = [{ off: 0, len: 128, kind: 'HDR' }]
  .concat(OMNI.segments.map((s) => ({ off: s.off, len: s.len + 64, kind: s.kind })))
  .concat([{ off: OMNI.trailer_off, len: 64, kind: 'TRL' }]);
for (const p of parts) {
  const d = el('div', 'k-' + p.kind);
  d.style.width = (100 * p.len / OMNI.size) + '%';
  d.dataset.off = p.off; d.dataset.len = p.len; d.dataset.kind = p.kind;
  if (p.len / OMNI.size > 0.03) d.textContent = p.kind;
  d.title = `${p.kind} — ${p.len} bytes at 0x${p.off.toString(16)}`;
  d.onclick = () => showRegion(p);
  $('#map').appendChild(d);
}

// ---- the validation ladder ----------------------------------------------
// The lines are the ones `omni verify --level 6` printed. Nothing here decides
// anything; it displays what the verifier decided.
const vs = [];
for (const line of OMNI.verify) {
  const m = line.match(/^(V\d) (\S+)/);
  if (!m) continue;
  const s = el('span', 'v', m[1] + ' ' + m[2]);
  s.title = line.trim();
  $('#ladder').appendChild(s); vs.push(s);
}
const verdict = el('span', 'v', OMNI.verify[OMNI.verify.length - 1] || '');
verdict.style.marginLeft = 'auto'; verdict.style.fontWeight = '700';
$('#ladder').appendChild(verdict); vs.push(verdict);
window.runLadder = (ms = 190) => vs.forEach((s, i) => setTimeout(() => s.classList.add('ok'), i * ms));

// ---- the object graph, from the refs the objects carry -------------------
const seen = new Set();
function nodeFor(digest, depth) {
  const o = byDigest[digest];
  if (!o) return null;
  const wrap = el('div');
  const row = el('div', 'node');
  row.dataset.digest = digest;
  const kids = (o.refs || []).filter((d) => d !== digest);
  const fold = el('span', 'fold', kids.length ? (depth < 3 ? '▾' : '▸') : ' ');
  row.appendChild(fold);
  row.appendChild(el('span', 'dot dot-' + o.type));
  row.appendChild(el('span', 'ty', SHORT[o.type] || o.type));
  if (o.name) row.appendChild(el('span', 'nm', label(o.name)));
  else row.appendChild(el('span', 'dg', short(digest)));
  wrap.appendChild(row);

  let box = null;
  if (kids.length) {
    box = el('div', 'kids');
    if (depth >= 3) box.style.display = 'none';
    for (const k of kids) { const n = nodeFor(k, depth + 1); if (n) box.appendChild(n); }
    wrap.appendChild(box);
    fold.onclick = (e) => {
      e.stopPropagation();
      const open = box.style.display !== 'none';
      box.style.display = open ? 'none' : '';
      fold.textContent = open ? '▸' : '▾';
    };
  }
  row.onclick = () => select(digest);
  return wrap;
}
$('#tree').appendChild(nodeFor(OMNI.root, 0));

// ---- hex ----------------------------------------------------------------
// 16 bytes a row, offsets absolute, with the selection highlighted. The whole
// file is in the page, so a data object shows its weights rather than a note
// explaining why it cannot.
function drawHex(off, len, label, extra) {
  $('#hexwhere').textContent = label ? '· ' + label : '';
  const body = $('#hexbody');
  body.textContent = '';
  const start = Math.max(0, (off & ~15) - 16);
  const end = Math.min(OMNI.size, off + Math.max(len, 464) + 16);
  for (let r = start; r < end; r += 16) {
    const row = el('div', 'row');
    row.appendChild(el('span', 'o', '0x' + r.toString(16).padStart(6, '0')));
    const b = el('span', 'b'); const a = el('span', 'a');
    for (let i = 0; i < 16; i++) {
      const at = r + i;
      const inSel = at >= off && at < off + len;
      const inX = extra && at >= extra[0] && at < extra[0] + extra[1];
      const pair = at < OMNI.size ? hexAt(at, 1) : '  ';
      const sp = el('span', inSel ? 'hl' : (inX ? 'hl2' : ''), pair + (i === 7 ? '  ' : ' '));
      b.appendChild(sp);
      const code = at < OMNI.size ? parseInt(pair, 16) : 32;
      const ch = code >= 32 && code < 127 ? String.fromCharCode(code) : '·';
      a.appendChild(el('span', inSel ? 'hl' : (inX ? 'hl2' : ''), ch));
    }
    row.appendChild(b); row.appendChild(a);
    body.appendChild(row);
  }
  body.scrollTop = 0;
}

function colourCbor(text) {
  const esc = text.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  return esc
    .replace(/h'([0-9a-f]{64})'/g, (_, d) => `<span class="dig">h'${d.slice(0, 8)}…'</span>`)
    .replace(/"([^"]*)":/g, '<span class="key">"$1"</span>:')
    .replace(/: "([^"]*)"/g, ': <span class="str">"$1"</span>')
    .replace(/\b(-?\d+\.?\d*)\b/g, '<span class="num">$1</span>');
}

// ---- selection ----------------------------------------------------------
let current = null;
function select(digest) {
  const o = byDigest[digest];
  if (!o) return;
  current = digest;
  document.querySelectorAll('.node').forEach((n) =>
    n.classList.toggle('on', n.dataset.digest === digest));
  document.querySelectorAll('#map div').forEach((d) => {
    const s = +d.dataset.off, e = s + +d.dataset.len;
    d.classList.toggle('on', o.off >= s && o.off < e);
  });
  drawHex(o.off, o.len, `${o.type} at 0x${o.off.toString(16)}`);
  $('#legend').innerHTML = `<b>${o.len} bytes</b> of `
    + (o.type === 'Blob' ? 'tensor payload' : 'canonical OMNI-CBOR (§03.2)')
    + ` — the digest covers exactly these bytes (§03.5.2)`;

  const info = $('#infobody'); info.textContent = '';
  const t = el('table', 'kv');
  const add = (k, v, cls) => {
    const tr = el('tr'); tr.appendChild(el('td', null, k));
    const td = el('td', cls); td.innerHTML = v; tr.appendChild(td); t.appendChild(tr);
  };
  add('type', `<span class="pill">${o.type}</span>` + (o.name ? o.name : ''));
  add('digest', `b3:${o.digest.slice(0, 32)}<br>&nbsp;&nbsp;&nbsp;${o.digest.slice(32)}`,
    'cbor');
  add('extent', `0x${o.off.toString(16)} … 0x${(o.off + o.len).toString(16)} (${o.len} B)`);
  add('flags', o.flags.split(',').map((f) => `<span class="pill">${f}</span>`).join(''));
  if (o.refs && o.refs.length) add('refs', o.refs.length + ' object(s)');
  info.appendChild(t);
  if (o.diag) {
    const p = el('pre', 'cbor'); p.innerHTML = colourCbor(o.diag); info.appendChild(p);
  } else {
    info.appendChild(el('div', 'note',
      'A data object: bytes, with no interior structure the format looks at. '
      + 'Its identity is still its digest, which is why a chunk shared by two '
      + 'models is stored once.'));
  }
}

function showRegion(p) {
  document.querySelectorAll('.node').forEach((n) => n.classList.remove('on'));
  document.querySelectorAll('#map div').forEach((d) =>
    d.classList.toggle('on', +d.dataset.off === p.off));
  const info = $('#infobody'); info.textContent = '';
  if (p.kind === 'HDR') {
    drawHex(0, 128, 'FileHeader (§02.3)');
    $('#legend').innerHTML = '<b>128 bytes</b>, fixed — the only part of the format '
      + 'whose layout can never change (§02.3)';
    const t = el('table', 'kv');
    for (const f of OMNI.header) {
      const tr = el('tr');
      tr.appendChild(el('td', null, f.name));
      const td = el('td');
      td.innerHTML = `<span class="num">${hexAt(f.off, Math.min(f.len, 8))
        .replace(/(..)/g, '$1 ')}</span>` + (f.len > 8 ? '…' : '')
        + (f.value ? ` <span style="color:var(--dim)">${f.value}</span>` : '');
      tr.appendChild(td); t.appendChild(tr);
      tr.onmouseenter = () => drawHex(f.off, f.len, 'FileHeader · ' + f.name);
    }
    info.appendChild(t);
    info.appendChild(el('div', 'note',
      'Two reads open a container of any size: this header, then the superblock it '
      + 'points at (§02.7). Nothing scans.'));
    return;
  }
  if (p.kind === 'TRL') {
    drawHex(OMNI.trailer_off, 64, 'FileTrailer (§02.9)');
    $('#legend').innerHTML = '<b>64 bytes</b> — superblock offset, length, digest, '
      + 'flags, CRC, end magic';
    info.appendChild(el('div', 'note',
      'The trailer is what makes a container readable from the end, so a stream that '
      + 'was appended to still opens. The last eight bytes are the end magic; a file '
      + 'that lacks them was truncated.'));
    return;
  }
  const seg = OMNI.segments.find((s) => s.off === p.off);
  drawHex(p.off, 64, `${p.kind} segment header at 0x${p.off.toString(16)}`,
    [p.off + 64, Math.min(seg ? seg.len : 0, 256)]);
  $('#legend').innerHTML = `<b>64-byte segment header</b> (highlighted) then `
    + `<b>${kib(seg ? seg.len : 0)}</b> of payload (dimmer highlight)`;
  const inSeg = OMNI.objects.filter((o) => o.off >= p.off && o.off < p.off + p.len);
  const t = el('table', 'kv');
  const add = (k, v) => { const tr = el('tr'); tr.appendChild(el('td', null, k));
    const td = el('td'); td.innerHTML = v; tr.appendChild(td); t.appendChild(tr); };
  add('segment', `<span class="pill">${p.kind}</span>`);
  add('offset', '0x' + p.off.toString(16));
  add('payload', kib(seg ? seg.len : 0));
  add('objects', inSeg.length ? inSeg.length + ' in here' : '—');
  info.appendChild(t);
  const why = {
    SUPER: 'The superblock: what the file holds, where, and under which hash. Written '
      + 'twice — once at the front and once at the back, byte-identical (R-C10) — so '
      + 'either end of a damaged file can still describe it.',
    OBJ: 'Structure objects: manifest, metadata, the tensor table and every descriptor. '
      + 'Kilobytes, and enough to answer every question `omni inspect` asks without '
      + 'reading a single weight.',
    BLOB: 'The weights. Every data object starts on a 4096-byte boundary (R-C08), which '
      + 'is what lets a reader map one and hand the pointer to a GPU.',
    INDEX: 'The one structure in OMNI that is not CBOR: a fixed-layout, sorted array of '
      + '64-byte entries, designed to be used straight out of an mmap with zero '
      + 'parsing (§02.6).',
    PAD: 'Padding, and it is not free: this is what alignment costs. It has to be zero '
      + 'and the verifier checks it (R-C07), so there is nowhere in a container to '
      + 'hide bytes that no digest covers.',
  }[p.kind];
  if (why) info.appendChild(el('div', 'note', why));
}

// ---- keyboard, for anyone who would rather not click --------------------
document.onkeydown = (e) => {
  const rows = [...document.querySelectorAll('.node')];
  const i = rows.findIndex((r) => r.dataset.digest === current);
  if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault();
    select(rows[Math.min(rows.length - 1, i + 1)].dataset.digest); }
  if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault();
    select(rows[Math.max(0, i - 1)].dataset.digest); }
  if (e.key === 'v') window.runLadder();
};

// A container opens at its header, so that is where this opens too.
showRegion(parts[0]);
</script>
</body>
</html>

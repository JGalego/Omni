[workspace]
resolver = "2"
members = ["omni-core", "omni-cli", "omni-conformance", "omni-ffi"]
# Needs nightly and pulls in libfuzzer-sys; see fuzz/README.md.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/jgalego/Omni"
# The minimum supported Rust version, and it is measured rather than chosen:
# 1.87 is the release that stabilized `unsigned_is_multiple_of`, and 1.86 fails
# to build this workspace for that reason alone. CI builds and tests on exactly
# this toolchain so the number stays true. Declaring it is what turns "use of
# unstable library feature" — an error that reads like a bug in this crate — into
# cargo saying which compiler is required.
rust-version = "1.87"

# The internal dependency lives here so its version requirement is written once.
# A `path` dependency with no `version` cannot be packaged at all — cargo strips
# the path on publish and would have nothing left to resolve — and the version
# has to be a literal because cargo does not interpolate `workspace.package`
# into it. CI asserts this number and `workspace.package.version` agree, since
# two literals that must match are two literals that will not.
[workspace.dependencies]
omni-core = { path = "omni-core", version = "0.1.0" }

[profile.release]
opt-level = 3
lto = true

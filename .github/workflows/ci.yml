name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: rust (${{ matrix.toolchain }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Beta is an early-warning signal for upcoming toolchain changes; it must
    # not gate the branch.
    continue-on-error: ${{ matrix.toolchain == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        toolchain: [stable, beta]
        include:
          # The container format is little-endian only (§03.9) and the parser
          # does explicit byte-order conversion, so cross-platform agreement is
          # a correctness property worth testing rather than assuming.
          - os: macos-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable
    defaults:
      run:
        working-directory: reference
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt,clippy
          rustup default ${{ matrix.toolchain }}
          rustc --version && cargo --version

      - name: Formatting
        run: cargo fmt --all --check

      # Clippy on stable only. A new lint landing in beta is a signal, not a
      # reason to block every branch in the repository.
      - name: Lint
        if: matrix.toolchain == 'stable'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all --all-features

      - name: Build (release)
        run: cargo build --release --all

  container-conformance:
    name: container conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: reference
        run: cargo build --release

      - name: Container round-trips and validates
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" --version
          "$OMNI" example /tmp/ci.omni
          "$OMNI" inspect /tmp/ci.omni
          "$OMNI" verify  /tmp/ci.omni
          "$OMNI" verify  /tmp/ci.omni --level 6

      - name: Packing is byte-reproducible (writer rule W1)
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" example /tmp/a.omni >/dev/null
          "$OMNI" example /tmp/b.omni >/dev/null
          cmp /tmp/a.omni /tmp/b.omni
          echo "two independent packs are byte-identical"

      - name: Committed example matches a fresh build
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" example /tmp/fresh.omni >/dev/null
          if ! cmp -s /tmp/fresh.omni examples/toy.omni; then
            echo "::error::examples/toy.omni differs from a fresh pack."
            echo "The container encoding changed. Regenerate it and update"
            echo "examples/README.md and docs/spec/02-container.md §2.11:"
            echo "    cd examples && ../reference/target/release/omni example toy.omni"
            sha256sum /tmp/fresh.omni examples/toy.omni
            exit 1
          fi
          echo "committed example is reproducible from source"

      # §01 axiom A5: a container and a directory are two backings for one
      # graph, so the round trip must not perturb a single byte.
      - name: Container round-trips through a directory store
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" unpack examples/toy.omni -o /tmp/toy.omnid
          "$OMNI" pack   /tmp/toy.omnid    -o /tmp/repacked.omni
          cmp /tmp/repacked.omni examples/toy.omni
          echo "container -> .omnid -> container is byte-identical"

      # §02.8: a container whose index, superblock and trailer are destroyed is
      # rebuilt by scanning. Content addressing is what makes the result
      # trustworthy rather than merely plausible.
      - name: A wrecked container is recovered exactly
        run: |
          OMNI=reference/target/release/omni
          python3 -c "
          d = bytearray(open('examples/toy.omni','rb').read())
          d[-8192:] = b'\x00' * 8192   # index + back superblock + trailer
          open('/tmp/wrecked.omni','wb').write(bytes(d))"
          if "$OMNI" verify /tmp/wrecked.omni >/dev/null 2>&1; then
            echo "::error::the wrecked file should not verify"; exit 1
          fi
          "$OMNI" fsck /tmp/wrecked.omni --rebuild -o /tmp/repaired.omni
          cmp /tmp/repaired.omni examples/toy.omni
          echo "recovered byte-identically from the undamaged original"

      - name: Corruption is detected
        run: |
          OMNI=reference/target/release/omni
          cp examples/toy.omni /tmp/bad.omni
          # Flip a bit inside the BLOB segment; verification must fail.
          printf '\x01' | dd of=/tmp/bad.omni bs=1 seek=20000 count=1 conv=notrunc status=none
          if "$OMNI" verify /tmp/bad.omni >/dev/null 2>&1; then
            echo "::error::verify accepted a corrupted container"; exit 1
          fi
          echo "corruption detected"
          # Truncation must also fail, not crash.
          head -c 40000 examples/toy.omni > /tmp/trunc.omni
          if "$OMNI" verify /tmp/trunc.omni >/dev/null 2>&1; then
            echo "::error::verify accepted a truncated container"; exit 1
          fi
          echo "truncation detected"

      # The value layer of §04-§05 is only a claim until something reads a
      # container whose tensors are expressions rather than byte ranges.
      - name: The value layer round-trips through a container
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" example --quantized /tmp/q.omni
          "$OMNI" verify /tmp/q.omni --level 6
          # Four tensors over one set of stored bytes (§04.8): the int4 weight,
          # its bf16 dequantization, the LoRA-merged bf16, and the fp8 cast.
          "$OMNI" cat /tmp/q.omni --tensor model.layers.0.attn.q_proj.weight.bf16 --limit 4
          "$OMNI" cat /tmp/q.omni --tensor model.layers.0.attn.q_proj.weight.lora --limit 4
          "$OMNI" cat /tmp/q.omni --tensor model.layers.0.attn.q_proj.weight.fp8  --limit 4
          # The derived realizations cost no storage.
          "$OMNI" inspect /tmp/q.omni | grep -q 'affine-sub-u4 g32'
          # §04.7.4: reading 64 of 2048 elements fetches 32 bytes, exactly.
          "$OMNI" deps /tmp/q.omni --tensor model.layers.0.attn.q_proj.weight.bf16 \
            --range 0:64 | grep -q 'bytes 0..32 (32 B)'
          echo "expressions evaluate, and a partial read reads only its part"

      # §06.7: a tokenizer that changed during conversion is a silent quality
      # regression everywhere else. Here it is a build failure.
      - name: The tokenizer is checked, not trusted
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" example --tokenizer /tmp/tok.omni
          "$OMNI" verify /tmp/tok.omni --tokenizer | tee /tmp/tokv.txt
          grep -q '5/5 vectors pass' /tmp/tokv.txt
          # §06.7's vocabulary/embedding agreement: a truncated conversion shows
          # up here rather than as garbage logits.
          grep -q 'vocabulary matches' /tmp/tokv.txt
          "$OMNI" inspect /tmp/tok.omni | grep -q 'tokenizer     bpe · 256 tokens'
          # An independent oracle: the ids of a byte-level tokenizer are the
          # UTF-8 bytes of the input. Computed here from the definition, not by
          # asking the encoder what it thinks.
          want=$(python3 -c "print(','.join(str(b) for b in 'Héllo, world!'.encode()))")
          got=$("$OMNI" tokenize /tmp/tok.omni --text 'Héllo, world!' | sed -n 2p)
          [ "$want" = "$got" ] || { echo "ids $got != $want"; exit 1; }
          "$OMNI" tokenize /tmp/tok.omni --text 'Héllo, world!' | grep -q '; round-trips'
          # `;` lines are comments, as in `omni cat`; the last line is the datum.
          [ "$("$OMNI" tokenize /tmp/tok.omni --ids "$want" | tail -n 1)" = 'Héllo, world!' ]
          # A container with no tokenizer is indeterminate and incomplete, never
          # "valid, no tokenizer problems" (§15.1).
          "$OMNI" example /tmp/plain.omni
          # GitHub runs `run:` blocks under `bash -e`, so a bare
          # `cmd; test $? = N` dies on cmd's non-zero exit before the assertion
          # is ever reached. Semantic exit codes have to be captured, not tested
          # after the fact.
          expect() {
            local want=$1; shift
            local got=0
            "$@" >/dev/null 2>&1 || got=$?
            if [ "$got" != "$want" ]; then
              echo "::error::$* exited $got, expected $want"; exit 1
            fi
          }
          expect 3 "$OMNI" verify /tmp/plain.omni --tokenizer
          expect 5 "$OMNI" tokenize /tmp/plain.omni --text hi
          echo "the tokenizer reproduces its own vectors, and refuses when it cannot"

      # §06.9: a chat template is the last place arbitrary code still runs in a
      # model artifact. OMNI-CT renders without a sandbox because there is
      # nothing to sandbox.
      - name: The chat template is total, and checked
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" example --chat-template /tmp/ct.omni
          "$OMNI" verify /tmp/ct.omni --template --level 6 | tee /tmp/ctv.txt
          grep -q '3/3 vectors pass' /tmp/ctv.txt
          # The cached `compiled` AST is derived, so V6 recomputes it.
          grep -q '2 derived object(s) recomputed, 0 mismatched' /tmp/ctv.txt
          # The required inputs are computable without rendering — that is what
          # a total language buys.
          [ "$("$OMNI" render /tmp/ct.omni --inputs | tail -n +2 | tr '\n' ' ')" \
            = "add_generation_prompt messages " ]
          out=$("$OMNI" render /tmp/ct.omni --message system:Hi --message user:Yo \
                  --var add_generation_prompt=true)
          [ "$out" = "$(printf '<|system|>\nHi<|end|>\n<|user|>\nYo<|end|>\n<|assistant|>')" ] \
            || { echo "rendered: $out"; exit 1; }
          # A missing input is refused with the list of what was wanted, not
          # rendered as the empty string.
          # GitHub runs `run:` blocks under `bash -e`, so a bare
          # `cmd; test $? = N` dies on cmd's non-zero exit before the assertion
          # is ever reached. Semantic exit codes have to be captured, not tested
          # after the fact.
          expect() {
            local want=$1; shift
            local got=0
            "$@" >/dev/null 2>&1 || got=$?
            if [ "$got" != "$want" ]; then
              echo "::error::$* exited $got, expected $want"; exit 1
            fi
          }
          expect 2 "$OMNI" render /tmp/ct.omni --message user:hi
          expect 5 "$OMNI" render /tmp/plain.omni --message user:hi
          expect 3 "$OMNI" verify /tmp/plain.omni --template
          "$OMNI" inspect /tmp/ct.omni | grep -q 'chat template omni-ct/1'
          echo "the template renders identically, or says why not"

      # §02.7 and §04.7.4 are claims about I/O, and an implementation that reads
      # the whole file cannot demonstrate either. This measures them.
      - name: Opening a container reads its framing, not its weights
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" open examples/toy.omni | tee /tmp/open.txt
          grep -q '4 reads' /tmp/open.txt
          # A partial read moves exactly what the plan said, and nothing else.
          "$OMNI" open examples/toy.omni --tensor model.embed_tokens.weight \
            --range 0:64 | tee /tmp/range.txt
          grep -q 'plan         1 chunk read(s), 128 B' /tmp/range.txt
          grep -q 'payload      1 reads, 128 B moved for 128 B planned' /tmp/range.txt
          python3 - <<'PY'
          import re
          txt = open('/tmp/range.txt').read()
          pct = float(re.search(r'total .*\(([\d.]+) % of the file\)', txt).group(1))
          assert pct < 10, f"reading 64 elements touched {pct} % of the file"
          print(f"64 of 16384 elements cost {pct} % of the file")
          PY

      # §09.1: training state is separable, and the rule is normative — the
      # inference artifact and the checkpoint must never be the same download.
      - name: A checkpoint separates from its own weights
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" example --training --step 127500 /tmp/ck1.omni >/dev/null
          "$OMNI" example --training --step 128000 --parent /tmp/ck1.omni /tmp/ck2.omni
          "$OMNI" verify /tmp/ck2.omni --level 6 | tee /tmp/ckv.txt
          grep -q 'V5 training    ✓' /tmp/ckv.txt
          "$OMNI" inspect /tmp/ck2.omni | tee /tmp/cki.txt
          grep -q 'training      step 128,000' /tmp/cki.txt
          grep -q 'separable' /tmp/cki.txt
          # §09.3: the promise is narrow and the report says so. This checkpoint
          # carries a stateful CPU generator, as real ones do.
          "$OMNI" verify /tmp/ck2.omni --reproducible | tee /tmp/ckr.txt
          grep -q 'not portably' /tmp/ckr.txt
          grep -q 'pytorch-cpu' /tmp/ckr.txt

          # §09.1's rule 1: stripping removes the training state by reachability
          # alone and leaves *identical tensor digests*. Checked here against the
          # digests themselves, not against sizes.
          "$OMNI" strip /tmp/ck2.omni --training -o /tmp/infer.omni | tee /tmp/strip.txt
          grep -q 'every digest unchanged' /tmp/strip.txt
          "$OMNI" verify /tmp/infer.omni --level 6 >/dev/null
          python3 - <<'PY'
          import subprocess
          def blobs(path):
              out = subprocess.run(['reference/target/release/omni', 'ls', path],
                                   capture_output=True, text=True, check=True).stdout
              return {l.split()[0] for l in out.splitlines()[1:] if l.split()[1] == 'Blob'}
          full, stripped = blobs('/tmp/ck2.omni'), blobs('/tmp/infer.omni')
          assert stripped < full, "stripping should remove objects"
          # Every object that survived is byte-identical by construction: it is
          # the same digest. What matters is that the *weights* are all there.
          plain = blobs('/tmp/weights-only.omni') if False else None
          print(f"{len(full)} -> {len(stripped)} data objects; "
                f"{len(full - stripped)} were training-only")
          assert len(full - stripped) > 0
          PY
          # The inference artifact must be much smaller: f32 moments over bf16
          # weights is the usual ratio, and this toy keeps it.
          before=$(stat -c%s /tmp/ck2.omni); after=$(stat -c%s /tmp/infer.omni)
          python3 -c "
          import sys
          before, after = $before, $after
          assert after * 3 < before, f'{after} is not much smaller than {before}'
          print(f'inference artifact is {100*after/before:.0f} % of the checkpoint')"
          # And the stripped container carries no training state at all.
          if "$OMNI" inspect /tmp/infer.omni | grep -q '^training'; then
            echo "::error::the stripped container still reports training state"; exit 1
          fi

          # §09.6: a checkpoint chain is manifests with parents[]. The second
          # checkpoint costs its own metadata, because the objects it shares with
          # the first are shared by content addressing. (In this toy the moments
          # are identical by construction, so the delta is as small as it gets.)
          "$OMNI" log /tmp/ck2.omni --with /tmp/ck1.omni | tee /tmp/log.txt
          grep -q 'step 128000' /tmp/log.txt
          grep -q 'step 127500' /tmp/log.txt
          grep -q '2 checkpoint(s)' /tmp/log.txt
          # A chain whose parent is absent is incomplete (5), not invalid.
          expect() {
            local want=$1; shift
            local got=0
            "$@" >/dev/null 2>&1 || got=$?
            if [ "$got" != "$want" ]; then
              echo "::error::$* exited $got, expected $want"; exit 1
            fi
          }
          expect 5 "$OMNI" log /tmp/ck2.omni

          # §09.4.2: resharding rewrites the map, not the tensors. 4 -> 2 is
          # free; 4 -> 8 is not, and the report says which tensors and why.
          "$OMNI" reshard /tmp/ck2.omni --mesh tp=2 -o /tmp/r2.omni | tee /tmp/r2.txt
          grep -q 'mesh         tp=4 -> tp=2' /tmp/r2.txt
          grep -q '1 tensor(s) re-expressed with no bytes moved' /tmp/r2.txt
          grep -q '0 rewritten' /tmp/r2.txt
          "$OMNI" verify /tmp/r2.omni --level 6 >/dev/null
          "$OMNI" reshard /tmp/ck2.omni --mesh tp=8 -o /tmp/r8.omni | grep -q 'rechunk'
          # A mesh that cannot divide the tensor is refused with the numbers.
          "$OMNI" reshard /tmp/ck2.omni --mesh tp=3 -o /tmp/r3.omni 2>&1 | \
            grep -q 'cannot divide evenly' || { echo "::error::expected a refusal"; exit 1; }
          expect 1 "$OMNI" reshard /tmp/ck2.omni --mesh tp=3 -o /tmp/r3.omni
          # A model with no training state is indeterminate for all of this.
          "$OMNI" example /tmp/plainmodel.omni >/dev/null
          expect 3 "$OMNI" reshard /tmp/plainmodel.omni --mesh tp=2 -o /tmp/nope.omni
          echo "the checkpoint separates, reshards, and reports what it cannot promise"

      # §11.6: WebAssembly as portable semantics. The claim is that a runtime
      # from 2076 can execute a 2026 custom op without the 2026 toolchain; the
      # testable part is that an op *this* build has never heard of computes the
      # right numbers from the module the model shipped.
      - name: A plugin op runs under the restricted profile
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" example --plugin --tune 3 /tmp/plug.omni
          "$OMNI" inspect /tmp/plug.omni | tee /tmp/plugi.txt
          grep -q 'plugins       1 embedded' /tmp/plugi.txt
          grep -q 'runnable under §11.6' /tmp/plugi.txt
          "$OMNI" plugin list /tmp/plug.omni | grep -q 'expr ops     scale'
          # The tensor's value is a plugin node with no fallback, so these numbers
          # exist only if the WebAssembly ran: scaled = base × 2.5, exactly.
          first() { awk '/^ *-?[0-9]/ { print $1; exit }'; }
          base=$("$OMNI" cat /tmp/plug.omni --tensor model.layers.0.attn.q_proj.weight \
                   --limit 1 | first)
          scaled=$("$OMNI" cat /tmp/plug.omni \
                     --tensor model.layers.0.attn.q_proj.weight.scaled \
                     --limit 1 | first)
          python3 -c "
          base, scaled = float('$base'), float('$scaled')
          # Both numbers are printed to six decimals, so the comparison is on
          # what was printed rather than on the f64s behind them.
          assert abs(scaled - base * 2.5) < 1e-6, f'{scaled} != {base} * 2.5'
          print(f'the plugin computed {base} * 2.5 = {scaled}')"
          # And V5 checks it rather than shrugging: with the module present the
          # tensor is decidable.
          "$OMNI" verify /tmp/plug.omni --level 6 | tee /tmp/plugv.txt
          grep -q '^valid' /tmp/plugv.txt

          # The profile is enforced. A module importing anything but
          # `omni_plugin/1` is refused, and a module using a forbidden proposal
          # is refused — both at load, before anything runs.
          python3 - <<'PY'
          import subprocess, pathlib
          # A module that imports from wasi: forbidden by §11.6.
          m = bytearray(b"\0asm\x01\0\0\0")
          def section(i, body):
              return bytes([i]) + bytes([len(body)]) + body
          m += section(1, bytes([1, 0x60, 0, 0]))                      # type () -> ()
          imp = bytes([1]) + bytes([4]) + b"wasi" + bytes([3]) + b"log" + bytes([0, 0])
          m += section(2, imp)
          pathlib.Path('/tmp/bad.wasm').write_bytes(bytes(m))
          r = subprocess.run(['reference/target/release/omni', 'plugin', 'run',
                              '/tmp/bad.wasm', '--export', 'log'],
                             capture_output=True, text=True)
          assert r.returncode == 1, r
          assert 'forbidden' in (r.stdout + r.stderr).lower(), r.stderr
          print("an import outside omni_plugin/1 is refused:",
                (r.stdout + r.stderr).strip().splitlines()[-1])
          PY
          echo "the plugin host runs what the model shipped, and only that"

      # A diagram of a binary format that has drifted from the format is worse
      # than no diagram, so the explorer is generated from the container and this
      # step is what keeps it that way.
      - name: The container explorer matches the container
        run: |
          cp docs/explorer.html /tmp/explorer.committed.html
          python3 tools/build-explorer.py
          if ! cmp -s /tmp/explorer.committed.html docs/explorer.html; then
            echo "::error::docs/explorer.html is stale — run python3 tools/build-explorer.py"
            exit 1
          fi
          # And what it embeds is really the container: the whole file as hex, the
          # root the header names, and every object the index lists.
          python3 - <<'PY_EXP'
          import json, pathlib, re, subprocess
          page = pathlib.Path("docs/explorer.html").read_text()
          m = re.search(r"const OMNI = (\{.*?\});\n", page, re.S)
          assert m, "no embedded data in the explorer"
          d = json.loads(m.group(1))
          raw = pathlib.Path("examples/toy.omni").read_bytes()
          assert d["size"] == len(raw), (d["size"], len(raw))
          assert d["hex"] == raw.hex(), "the embedded bytes are not the container's"
          assert d["root"] == raw[64:96].hex(), "the root is not the one the header names"
          ls = subprocess.run(["reference/target/release/omni", "ls",
                               "examples/toy.omni", "--full"],
                              capture_output=True, text=True, check=True).stdout
          rows = [r.split() for r in ls.splitlines()[1:] if r.strip()]
          assert len(d["objects"]) == len(rows), (len(d["objects"]), len(rows))
          for o, r in zip(d["objects"], rows):
              assert o["digest"] == r[0] and o["type"] == r[1], (o, r)
              assert o["off"] == int(r[2]) and o["len"] == int(r[3]), (o, r)
          # The validation lines are the verifier's, not prose.
          v = subprocess.run(["reference/target/release/omni", "verify",
                              "examples/toy.omni", "--level", "6"],
                             capture_output=True, text=True, check=True).stdout
          for line in d["verify"]:
              assert line in v, f"the explorer claims a line the verifier did not print: {line}"
          print(f"the explorer embeds {len(d['objects'])} objects and "
                f"{len(raw)} bytes, all of them the container's")
          PY_EXP

          # The recording is committed rather than built in CI — headless Chromium
          # is not a build dependency — so what CI checks is that it is a GIF of
          # the size the page is recorded at, and that it did not rot.
          python3 - <<'PY_GIF'
          import pathlib, struct
          g = pathlib.Path("assets/explorer.gif").read_bytes()
          assert g[:6] == b"GIF89a", g[:6]
          w, h = struct.unpack("<HH", g[6:10])
          assert (w, h) == (1160, 660), (w, h)
          assert g[-1:] == b"\x3b", "the GIF has no terminator"
          assert b"NETSCAPE2.0" in g[:800], "the GIF does not declare looping"
          frames = g.count(b"\x21\xf9\x04")
          assert frames > 50, f"only {frames} frames"
          print(f"assets/explorer.gif: {w}x{h}, {frames} frames, "
                f"{len(g)/1024/1024:.2f} MiB")
          PY_GIF

      # §08 + import: a PEFT LoRA is safetensors plus a config, and the thing OMNI
      # adds is that the base is pinned by digest rather than named by a string.
      - name: A PEFT LoRA imports as an adapter pinned to its base
        run: |
          OMNI=$PWD/reference/target/release/omni

          # A base and a LoRA over it, both written from the formats' own
          # definitions in Python — PEFT's tensor naming included.
          python3 - <<'PY_LORA'
          import json, os, struct
          def write(path, tensors):
              header, data = {}, b""
              for name, shape in tensors:
                  n = 1
                  for d in shape:
                      n *= d
                  payload = b"".join(struct.pack("<H", (i * 37) % 0x3F80) for i in range(n))
                  header[name] = {"dtype": "BF16", "shape": shape,
                                  "data_offsets": [len(data), len(data) + len(payload)]}
                  data += payload
              h = json.dumps(header).encode()
              open(path, "wb").write(struct.pack("<Q", len(h)) + h + data)

          write("/tmp/lora-base.safetensors", [
              (f"model.layers.{l}.self_attn.{p}.weight", [16, 16])
              for l in range(2) for p in ("q_proj", "k_proj", "v_proj", "o_proj")])

          os.makedirs("/tmp/lora", exist_ok=True)
          write("/tmp/lora/adapter_model.safetensors",
                [(f"base_model.model.model.layers.{l}.self_attn.{p}.lora_{ab}.weight",
                  [8, 16] if ab == "A" else [16, 8])
                 for l in range(2) for p in ("q_proj", "v_proj") for ab in ("A", "B")])
          json.dump({"peft_type": "LORA", "r": 8, "lora_alpha": 16, "lora_dropout": 0.05,
                     "base_model_name_or_path": "acme/toy-base", "task_type": "CAUSAL_LM",
                     "target_modules": ["q_proj", "v_proj"], "bias": "none"},
                    open("/tmp/lora/adapter_config.json", "w"))
          print("wrote a base and a PEFT LoRA over it")
          PY_LORA

          "$OMNI" import safetensors /tmp/lora-base.safetensors -o /tmp/lora-base.omni \
            --name acme/toy-base >/dev/null
          "$OMNI" import peft /tmp/lora --base /tmp/lora-base.omni -o /tmp/lora.omni \
            | tee /tmp/peft.txt

          # Two layers × two targets, each a factor pair, each verified (I4).
          grep -q '4 tensor pair(s)' /tmp/peft.txt
          grep -q '8 verified byte-for-byte against the source' /tmp/peft.txt
          # I1: the base is pinned by digest; PEFT's name for it is not an identity.
          grep -q 'pinned by digest, not by the name PEFT gave' /tmp/peft.txt
          # The base declares no axes — safetensors says nothing about them — so no
          # rank-axis requirement is written rather than one that cannot be met.
          grep -q 'no rank-axis requirement written' /tmp/peft.txt

          # It is a valid container on its own: an adapter is a publishable artifact
          # (§08.1), and its base being absent is expected rather than incomplete.
          "$OMNI" verify /tmp/lora.omni --level 6 | tee /tmp/peftv.txt
          grep -q '^valid' /tmp/peftv.txt
          grep -q 'V5 adapter     ✓ lora over 8 factor tensor(s), 2 attach rule(s), rank 8' \
            /tmp/peftv.txt
          grep -q 'declared optional and not present' /tmp/peftv.txt

          # §08.3: it attaches to the base it was built over, binding each layer's
          # own factors, and touches nothing it did not train.
          "$OMNI" adapter check /tmp/lora-base.omni /tmp/lora.omni | tee /tmp/pefta.txt
          grep -q 'attached      4 tensor(s)' /tmp/pefta.txt
          grep -q '^attachable' /tmp/pefta.txt
          grep -q 'layers.0.self_attn.q_proj.weight' /tmp/pefta.txt
          if grep -q 'k_proj' /tmp/pefta.txt; then
            echo "::error::the adapter touched k_proj, which was not a target"; exit 1
          fi

          # And it refuses, by name, every config field that would change what the
          # update is.
          python3 - <<'PY_REFUSE'
          import json, subprocess
          base = json.load(open("/tmp/lora/adapter_config.json"))
          for field, value in [("use_dora", True), ("fan_in_fan_out", True),
                               ("use_rslora", True), ("rank_pattern", {"q_proj": 4}),
                               ("alpha_pattern", {"q_proj": 8}),
                               ("modules_to_save", ["score"]), ("peft_type", "IA3")]:
              cfg = dict(base)
              cfg[field] = value
              json.dump(cfg, open("/tmp/lora/adapter_config.json", "w"))
              r = subprocess.run(["reference/target/release/omni", "import", "peft",
                                  "/tmp/lora", "--base", "/tmp/lora-base.omni",
                                  "-o", "/tmp/nope.omni"],
                                 capture_output=True, text=True)
              out = r.stdout + r.stderr
              assert r.returncode != 0, f"{field} was accepted"
              assert field in out or "LORA" in out, f"{field}: {out[:200]}"
          json.dump(base, open("/tmp/lora/adapter_config.json", "w"))
          print("every field that changes the update is refused by name")
          PY_REFUSE

          # A LoRA over the wrong base does not attach, and says which rule.
          "$OMNI" example /tmp/other-base.omni >/dev/null
          set +e
          "$OMNI" adapter check /tmp/other-base.omni /tmp/lora.omni > /tmp/wrong.txt 2>&1
          rc=$?
          set -e
          test "$rc" != 0
          grep -qi 'R-A01\|not present\|unmatched\|matched no' /tmp/wrong.txt

          # And back out again: an adapter that can only be read is half a
          # format. The factors have to come back byte for byte under the names
          # PEFT uses, prefix included.
          "$OMNI" export peft /tmp/lora.omni -o /tmp/lora-back | tee /tmp/peftx.txt
          grep -q 'targets      q_proj, v_proj' /tmp/peftx.txt
          python3 - <<'PY_RT'
          import json, struct
          def load(p):
              raw = open(p, "rb").read()
              n = struct.unpack("<Q", raw[:8])[0]
              head = json.loads(raw[8:8 + n]); base = 8 + n
              return {k: raw[base + v["data_offsets"][0]:base + v["data_offsets"][1]]
                      for k, v in head.items() if k != "__metadata__"}
          a = load("/tmp/lora/adapter_model.safetensors")
          b = load("/tmp/lora-back/adapter_model.safetensors")
          assert set(a) == set(b), f"names differ: {sorted(set(a) ^ set(b))}"
          bad = [k for k in a if a[k] != b[k]]
          assert not bad, f"{len(bad)} factor(s) differ: {bad[:3]}"
          cfg = json.load(open("/tmp/lora-back/adapter_config.json"))
          assert cfg["peft_type"] == "LORA", cfg
          assert cfg["target_modules"] == ["q_proj", "v_proj"], cfg
          # The guarantee OMNI adds over PEFT is the digest, and it survives the
          # trip out rather than being dropped at the boundary.
          assert len(cfg["omni_base_digest"]) == 64, cfg
          print(f"{len(a)} LoRA factors round-tripped byte for byte")
          PY_RT

          # The exported adapter re-imports and still attaches to the same base.
          "$OMNI" import peft /tmp/lora-back --base /tmp/lora-base.omni \
            -o /tmp/lora-again.omni > /dev/null
          "$OMNI" adapter check /tmp/lora-base.omni /tmp/lora-again.omni \
            | grep -q attachable
          echo "a PEFT LoRA imports, attaches, refuses another, and comes back out"

      # §13.5: the OCI mapping. The argument for it is parasitic adoption —
      # registries, mirrors, CDNs and signing already exist — so the layout has
      # to be one the existing tools actually read.
      - name: A container maps onto an OCI image layout and back
        run: |
          OMNI=$PWD/reference/target/release/omni
          "$OMNI" example --tune 4 /tmp/oci-src.omni >/dev/null
          rm -rf /tmp/layout
          "$OMNI" oci export /tmp/oci-src.omni -o /tmp/layout --ref 'omni/toy:1' \
            | tee /tmp/oci.txt
          grep -q 'application/vnd.omni.model.v1' /tmp/oci.txt
          grep -q 'the OMNI Manifest object itself' /tmp/oci.txt

          # The layout is checked against the image-spec's own rules rather than
          # against this implementation's opinion: the marker file, the index, the
          # descriptors, and every blob living at the path its own sha256 names.
          python3 - <<'PY_OCI'
          import hashlib, json, os, pathlib
          root = pathlib.Path("/tmp/layout")
          layout = json.loads((root / "oci-layout").read_text())
          assert layout == {"imageLayoutVersion": "1.0.0"}, layout
          index = json.loads((root / "index.json").read_text())
          assert index["schemaVersion"] == 2, index
          assert index["mediaType"] == "application/vnd.oci.image.index.v1+json"
          assert len(index["manifests"]) == 1, index

          def blob(desc):
              algo, hexd = desc["digest"].split(":")
              assert algo == "sha256", desc
              p = root / "blobs" / algo / hexd
              b = p.read_bytes()
              # The property a registry relies on: a blob is at the path its
              # content hashes to, and the descriptor's size is its size.
              assert hashlib.sha256(b).hexdigest() == hexd, f"{p} is misnamed"
              assert desc["size"] == len(b), desc
              return b

          md = index["manifests"][0]
          assert md["mediaType"] == "application/vnd.oci.image.manifest.v1+json"
          assert md["annotations"]["org.opencontainers.image.ref.name"] == "omni/toy:1"
          m = json.loads(blob(md))
          assert m["schemaVersion"] == 2
          assert m["artifactType"] == "application/vnd.omni.model.v1", m
          # The config is the OMNI Manifest object, per §13.5 — CBOR, not JSON.
          assert m["config"]["mediaType"] == "application/vnd.omni.manifest.v1+cbor"
          config = blob(m["config"])
          # Layers: packs, then the object index, in that order.
          kinds = [l["mediaType"] for l in m["layers"]]
          assert kinds[-1] == "application/vnd.omni.index.v1", kinds
          assert set(kinds[:-1]) == {"application/vnd.omni.pack.v1"}, kinds
          # Concatenating them in order is the container, and each layer says
          # where it belongs.
          out, at = b"", 0
          for l in m["layers"]:
              b = blob(l)
              off = int(l.get("annotations", {}).get("dev.omni.offset", at))
              assert off == at, f"layer claims offset {off}, assembled {at}"
              out += b
              at += len(b)
          src = pathlib.Path("/tmp/oci-src.omni").read_bytes()
          assert out == src, f"reassembled {len(out)} bytes, source is {len(src)}"
          # The annotations a registry UI would show are read from the model, and
          # every path in the layout is relative with no traversal in it.
          ann = m["annotations"]
          assert ann["dev.omni.canonical-digest"].startswith("b3:"), ann
          assert ann["dev.omni.file-size"] == str(len(src)), ann
          assert int(ann["dev.omni.params"]) > 0, ann
          for dirpath, _, files in os.walk(root):
              for f in files:
                  rel = os.path.relpath(os.path.join(dirpath, f), root)
                  assert ".." not in rel.split(os.sep), rel
          print(f"a valid OCI image layout: {len(m['layers'])} layers, "
                f"{len(config)}-byte config, reassembles exactly")
          PY_OCI

          # And the round trip through the CLI, with every blob verified.
          "$OMNI" oci import /tmp/layout -o /tmp/oci-back.omni | tee /tmp/ociback.txt
          cmp /tmp/oci-src.omni /tmp/oci-back.omni
          grep -q 'verified against their digests' /tmp/ociback.txt
          "$OMNI" verify /tmp/oci-back.omni --level 6 | grep -q '^valid'
          echo "a container maps to an OCI layout and back without losing a byte"

          # A tampered blob is what a bad mirror looks like, and it must not
          # reassemble into a model.
          python3 - <<'PY_TAMPER'
          import json, pathlib
          root = pathlib.Path("/tmp/layout")
          m = json.loads((root / "index.json").read_text())["manifests"][0]
          mf = json.loads((root / "blobs" / "sha256" / m["digest"].split(":")[1]).read_bytes())
          target = mf["layers"][0]["digest"].split(":")[1]
          p = root / "blobs" / "sha256" / target
          b = bytearray(p.read_bytes())
          b[len(b) // 2] ^= 0xFF
          p.write_bytes(bytes(b))
          PY_TAMPER
          rm -f /tmp/oci-bad.omni
          set +e
          "$OMNI" oci import /tmp/layout -o /tmp/oci-bad.omni > /tmp/ocibad.txt 2>&1
          rc=$?
          set -e
          test "$rc" != 0
          test ! -f /tmp/oci-bad.omni
          grep -q 'hashes to' /tmp/ocibad.txt
          echo "a tampered blob is refused before it becomes a file"

      # §13.4.3: the other half of the transport. A hub SHOULD serve both a
      # pack and per-object URLs, and having both here means each is tested
      # against a real implementation of the other rather than against a mock.
      - name: The object server and the range client speak to each other
        run: |
          OMNI=$PWD/reference/target/release/omni
          # SHA-256 rather than the default BLAKE3, for one reason: Python's
          # standard library can compute it, so the check below that a served
          # object hashes to the URL it came from is made by something other
          # than this implementation.
          "$OMNI" example --hash sha256 --tune 2 /tmp/served.omni >/dev/null

          "$OMNI" serve /tmp/served.omni --port 18781 --requests 200 \
            > /tmp/serve.log 2>&1 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for _ in $(seq 50); do
            python3 -c "
          import socket, sys
          sys.exit(0 if socket.socket().connect_ex(('127.0.0.1', 18781)) == 0 else 1)" \
              && break
            sleep 0.1
          done

          # The pack, range-read by this repository's own client: three requests
          # to open, one coalesced request for every object, each digest checked.
          "$OMNI" fetch http://127.0.0.1:18781/served.omni --all | tee /tmp/sf.txt
          grep -q 'open         3 request(s)' /tmp/sf.txt
          grep -q 'every object against its digest (R-O01)' /tmp/sf.txt

          # The sidecar it generates opens the pack it describes, R-X02 included.
          curl -sf http://127.0.0.1:18781/served.omni.idx -o /tmp/served.idx
          "$OMNI" index /tmp/served.idx --show | grep -q 'describes    a container of'
          "$OMNI" fetch http://127.0.0.1:18781/served.omni --sidecar /tmp/served.idx \
            | grep -q 'open         1 request(s)'

          # §13.4.3: every object at its own digest, and the bytes served hash to
          # the URL they were served from. That is the whole property.
          "$OMNI" ls /tmp/served.omni --full > /tmp/objs.txt
          python3 - <<'PY_OBJ'
          import hashlib, urllib.request
          rows = [r.split() for r in open('/tmp/objs.txt').read().splitlines()[1:] if r.strip()]
          assert rows, "no objects listed"
          checked = 0
          for digest, otype, *_ in rows:
              for path in (f"/objects/sha2-{digest}", f"/objects/{digest}"):
                  with urllib.request.urlopen(f"http://127.0.0.1:18781{path}") as r:
                      body, h = r.read(), r.headers
                  # The property, checked by hashlib rather than by the thing
                  # under test: the bytes served at a digest hash to it. Serving
                  # the stored (possibly compressed) form would fail here, which
                  # is why the server serves the logical form.
                  got = hashlib.sha256(body).hexdigest()
                  assert got == digest, f"{path} served bytes hashing to {got}"
                  want = ("application/vnd.omni.chunk.v1" if otype == "Blob"
                          else "application/vnd.omni.object.v1+cbor")
                  assert h["Content-Type"] == want, f"{digest}: {h['Content-Type']}"
                  # Every URL here is derived from a digest, so §13.4.2's cache
                  # advice is unconditionally correct and must be given.
                  assert h["Cache-Control"] == "public, max-age=31536000, immutable", \
                      h["Cache-Control"]
                  checked += 1
          print(f"{checked} object fetches, every one hashing to the URL it came from")
          PY_OBJ

          # Read-only, and no paths: writing is not a route, and there is nothing
          # to traverse into.
          code() { curl -s -o /dev/null -w '%{http_code}' --path-as-is "$@"; }
          test "$(code -X PUT http://127.0.0.1:18781/served.omni)" = 405
          test "$(code -X DELETE http://127.0.0.1:18781/)" = 405
          test "$(code http://127.0.0.1:18781/../../etc/passwd)" = 404
          test "$(code http://127.0.0.1:18781/objects/../../etc/passwd)" = 404
          test "$(code http://127.0.0.1:18781/objects/notadigest)" = 404
          test "$(code "http://127.0.0.1:18781/objects/$(printf 'f%.0s' $(seq 64))")" = 404
          # A range gets a range, not the whole file.
          test "$(curl -s -r 100-199 -o /dev/null -w '%{size_download}' \
                    http://127.0.0.1:18781/served.omni)" = 100
          echo "the object server serves both layouts of §13.4 and refuses the rest"

      # Gate 0's index-lookup target is a p99 in nanoseconds, and
      # `docs/design/performance.md` §11 records that the same binary's p99 moves
      # 30 % between runs on the machine it was measured on. So CI asserts the
      # figure that does not move: how many index entries a lookup compares,
      # which is what this code decides and is identical on every machine. A
      # regression here is a real regression; a slow p99 on a shared runner is
      # weather.
      - name: An index lookup compares the few entries it should
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" bench --objects 1000000 --lookups 20000 --rounds 1 | tee /tmp/bench.txt
          grep -q 'entries compared' /tmp/bench.txt
          python3 - <<'PY_BENCH'
          import re
          txt = open("/tmp/bench.txt").read()
          m = re.search(r"entries compared\s+([0-9.]+) per lookup \(worst (\d+)\)", txt)
          assert m, "the bench did not report entries compared"
          per, worst = float(m.group(1)), int(m.group(2))
          # 2.20 with interpolation inside a 16-bit bucket; 8.62 if it silently
          # fell back to scanning the bucket. The bound catches the fallback.
          assert per <= 3.0, f"{per} entries per lookup: the interpolation regressed"
          # And no lookup degenerates into a walk of the whole bucket.
          assert worst <= 24, f"worst case {worst} entries"
          print(f"index lookup: {per} entries compared per lookup, worst {worst}")
          PY_BENCH
          # Two-read open is another half of Gate 0 and is met by construction.
          grep -qE 'open +[0-9.]+ ms for 1,000,000 index entries' /tmp/bench.txt
          # And the verb now agrees: the gate's normative criterion is the entry
          # count, so `omni bench` exits 0 when it is met rather than failing on a
          # p99 that measures the runner's neighbours.
          grep -q 'Gate 0: <= 3 entries compared per lookup' /tmp/bench.txt
          grep -q '✓ met' /tmp/bench.txt

      # §07's claim is not that a graph type-checks — it is that a runtime which
      # has never heard of the architecture can *execute* it. Verification cannot
      # tell those apart, and did not: the synthesizer emitted a graph whose
      # attention attended across heads rather than across positions, which
      # verified perfectly and computed the wrong thing. Only running it found
      # that. So it is run.
      - name: A synthesized graph executes, and executing it is a different check
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" example --graph /tmp/run-graph.omni > /dev/null
          "$OMNI" graph run /tmp/run-graph.omni --tokens 1,2,3 | tee /tmp/run.txt
          # Two layers of a decoder, executed op by op over the container's own
          # weights, with the symbolic dimensions bound by the argument.
          grep -qE 'ran forward over [0-9]+ op' /tmp/run.txt
          grep -q 'dims           B=1, S=3' /tmp/run.txt
          grep -q 'result 0       \[1, 3, 256\] bf16' /tmp/run.txt
          # The example's weights are a byte pattern rather than a trained model,
          # so read as bf16 some of them are infinities and the logits are NaN.
          # That is arithmetic, and the verb says so rather than leaving it as a
          # surprise — an interpreter that quietly produced numbers here would be
          # hiding the one thing worth knowing.
          grep -q 'non-finite' /tmp/run.txt
          grep -q 'not a trained model' /tmp/run.txt

          # A weights-only container has no graph, which is legal (§07.5) and
          # indeterminate rather than invalid: exit 3.
          set +e
          "$OMNI" graph run examples/toy.omni --tokens 1 > /tmp/norun.txt 2>&1
          rc=$?
          set -e
          test "$rc" = 3
          grep -q 'weights-only' /tmp/norun.txt

          # A graph is untrusted input, so the interpreter is bounded and reports
          # the bound rather than running forever.
          set +e
          "$OMNI" graph run /tmp/run-graph.omni --tokens 1,2,3 --fuel 10 > /tmp/fuel.txt 2>&1
          rc=$?
          set -e
          test "$rc" != 0
          grep -q 'over the limit of 10' /tmp/fuel.txt

          # And the numbers themselves are checked in the unit tests, where a
          # decoder built from known weights has to produce a distribution over
          # the vocabulary and logits at position 0 that no later token can move.
          echo "the synthesized graph runs, is bounded, and says when its weights are not a model"

      # `docs/design/sdk.md` §3: the C ABI is "the binding substrate", and the
      # thing worth testing about a substrate is not that its header compiles.
      # It is that a C program with no Rust in it can drive the whole read path
      # and that the honest answers survive the boundary — a computed tensor has
      # no stored bytes, a u4 weight has no DLPack spelling, and both come back
      # as OMNI_INDETERMINATE rather than as a plausible wrong array.
      - name: A C program drives the whole read path through the C ABI
        run: |
          cargo build --release -p omni-ffi --manifest-path reference/Cargo.toml
          test -f reference/target/release/libomni.a
          test -f reference/target/release/libomni.so

          # The header and the library must agree about every symbol, in both
          # directions. A header that declares something the library does not
          # export is a link error for somebody else, later.
          python3 - <<'PY_SYM'
          import re, subprocess
          h = open("reference/omni-ffi/include/omni.h").read()
          decl = {d[:-1].strip() for d in re.findall(r'\bomni_[a-z0-9_]+\s*\(', h)}
          decl -= {"omni_status", "omni_objective"}   # typedef'd parameter types
          src = open("reference/omni-ffi/src/lib.rs").read()
          exported = set(re.findall(r'extern "C" fn (omni_[a-z0-9_]+)', src))
          nm = subprocess.run(["nm", "-D", "--defined-only",
                               "reference/target/release/libomni.so"],
                              capture_output=True, text=True).stdout
          syms = {l.split()[-1] for l in nm.splitlines() if " omni_" in l}
          assert not decl - exported, f"declared but not implemented: {sorted(decl - exported)}"
          assert not exported - decl, f"exported but not declared: {sorted(exported - decl)}"
          assert not decl - syms, f"not in the shared object: {sorted(decl - syms)}"
          print(f"{len(decl)} entry points, header and library agree")
          PY_SYM

          # Built the way a consumer would, with the warnings a consumer turns
          # on. `-Werror` is the point: a header that needs a cast to use is a
          # header that will be used wrongly.
          cc -Wall -Wextra -Werror -std=c11 -pedantic \
            reference/omni-ffi/examples/read.c \
            -I reference/omni-ffi/include \
            reference/target/release/libomni.a -lpthread -ldl -lm -o /tmp/omni-read

          OMNI=reference/target/release/omni
          "$OMNI" example --quantized /tmp/ffi.omni >/dev/null
          /tmp/omni-read /tmp/ffi.omni | tee /tmp/ffi.txt

          grep -q 'the C ABI read a container end to end' /tmp/ffi.txt
          # Zero copy actually happened: at least one tensor's bytes were a
          # pointer into the container rather than a copy of it.
          grep -q 'mapped=1' /tmp/ffi.txt
          # A `dequantize` said so instead of handing back its operand.
          grep -q 'computed=1' /tmp/ffi.txt
          grep -q 'is a `dequantize` expression, not stored bytes' /tmp/ffi.txt
          # DLPack both ways: bf16 goes over as kDLBfloat, u4 is refused by name.
          grep -q 'code 4, 16 bits' /tmp/ffi.txt
          grep -q "DLPack has no encoding for .u4." /tmp/ffi.txt
          if grep -q 'dlpack_ok=0' /tmp/ffi.txt; then
            echo "::error::no tensor made it over DLPack"; exit 1
          fi

          # A container the ABI must not accept, and a truncated one, are
          # statuses rather than crashes. This is the whole reason the boundary
          # catches panics.
          cat > /tmp/abuse.c <<'PY_ABUSE'
          #include <stdio.h>
          #include <string.h>
          #include "omni.h"
          int main(void) {
              omni_store *s = NULL;
              unsigned char junk[512];
              memset(junk, 0, sizeof junk);
              if (omni_store_open_bytes(junk, sizeof junk, &s) != OMNI_EINVALID) {
                  fprintf(stderr, "zeros were accepted as a container\n"); return 1;
              }
              printf("zeros: %s\n", omni_last_error());
              if (omni_store_open("/nonexistent.omni", &s) != OMNI_EINCOMPLETE) {
                  fprintf(stderr, "a missing file was not incomplete\n"); return 1;
              }
              printf("missing: %s\n", omni_last_error());
              if (omni_store_open(NULL, &s) != OMNI_EUSAGE) {
                  fprintf(stderr, "a null path was not a usage error\n"); return 1;
              }
              /* Freeing null is defined. */
              omni_store_close(NULL); omni_model_free(NULL);
              omni_plan_free(NULL); omni_tensor_release(NULL);
              printf("the boundary returns statuses, never crashes\n");
              return 0;
          }
          PY_ABUSE
          cc -Wall -Wextra -Werror -std=c11 /tmp/abuse.c \
            -I reference/omni-ffi/include \
            reference/target/release/libomni.a -lpthread -ldl -lm -o /tmp/omni-abuse
          /tmp/omni-abuse

          # Truncating a real container at every quarter must never crash the
          # ABI either. Any status is acceptable; a signal is not.
          python3 - <<'PY_TRUNC'
          import pathlib, subprocess
          raw = pathlib.Path("/tmp/ffi.omni").read_bytes()
          for frac in (1, 2, 3):
              cut = len(raw) * frac // 4
              pathlib.Path("/tmp/cut.omni").write_bytes(raw[:cut])
              r = subprocess.run(["/tmp/omni-read", "/tmp/cut.omni"],
                                 capture_output=True, text=True)
              assert r.returncode >= 0, f"killed by signal {-r.returncode} at {cut}"
              assert r.returncode in (0, 1, 2), f"unexpected rc {r.returncode} at {cut}"
          print("truncated containers produce statuses, not signals")
          PY_TRUNC

          echo "a C program read a container end to end through the C ABI"

      # `docs/design/sdk.md` §5 claims a conforming C0 reader needs only a header
      # parse, an index lookup, canonical CBOR, BLAKE3 and literal tensors. The
      # Rust implementation is evidence for that, but it also *wrote* these
      # containers, so on its own it cannot tell "the format is simple" from
      # "these two programs share an author's assumptions". A second reader, in a
      # different language, with nothing but its standard library, can.
      - name: A second implementation reads the same container
        run: |
          OMNI=reference/target/release/omni
          export OMNI_BIN="$PWD/$OMNI"

          # BLAKE3 against the official vectors, CRC-32C against its check value,
          # canonical CBOR against encodings that must be refused, and then the
          # part that matters: the same container read by both implementations.
          python3 bindings/python/test_omni.py 2>&1 | tee /tmp/pyt.txt
          grep -q '^OK' /tmp/pyt.txt
          grep -q 'the C0 reader:' /tmp/pyt.txt

          # And end to end from the command line, on the committed example.
          python3 bindings/python/omni.py examples/toy.omni --check | tee /tmp/pyread.txt
          grep -q 'objects         49' /tmp/pyread.txt
          grep -q 'tensors         12' /tmp/pyread.txt
          grep -q 'literal      12' /tmp/pyread.txt
          grep -q '49 object(s)' /tmp/pyread.txt
          # The two readers agree on the root digest in full, which is the whole
          # file's identity — so they agree about every object under it.
          root_py=$(python3 bindings/python/omni.py examples/toy.omni \
                      | grep -oE '[0-9a-f]{64}' | head -1)
          test -n "$root_py"
          "$OMNI" ls examples/toy.omni --full | grep Manifest | grep -q "$root_py"

          # C0 is a floor, and a floor is only honest if what is above it is
          # named. A quantized model's weights are `dequantize` expressions, and
          # the pure-Python reader refuses them by name rather than returning the
          # packed integers as if they were the weights.
          "$OMNI" example --quantized /tmp/pyq.omni > /dev/null
          python3 bindings/python/omni.py /tmp/pyq.omni --verbose > /tmp/pyq.txt
          grep -q 'above C0' /tmp/pyq.txt
          grep -q 'dequantize' /tmp/pyq.txt

          echo "the C0 budget claim holds in a second language, standard library only"
      # The other Python file in that directory is not a second reader — it is a
      # binding, over the C ABI, so it gets everything the Rust implementation
      # can do. Two things are worth proving about a ctypes binding: that the
      # handle lifetimes hold (a tensor outliving its store, a DLPack capsule
      # outliving every handle), and that DLPack is produced *correctly*, which
      # is checked by unwrapping the capsule rather than by trusting a consumer.
      - name: Python reaches the whole implementation through the C ABI
        run: |
          OMNI=reference/target/release/omni
          export OMNI_BIN="$PWD/$OMNI"
          cargo build --release -p omni-ffi --manifest-path reference/Cargo.toml

          python3 bindings/python/test_omni_ffi.py 2>&1 | tee /tmp/pyffi.txt
          grep -q '^OK' /tmp/pyffi.txt
          # The binding and the from-specification reader share no code, so
          # their agreeing on a tensor's bytes is worth more than either saying
          # so alone.
          grep -q 'tensors agree byte for byte across both readers' /tmp/pyffi.txt

          # And from the command line, on a quantized model, which is the case
          # the pure-Python reader cannot do at all.
          "$OMNI" example --quantized /tmp/pyffi.omni > /dev/null
          python3 bindings/python/omni_ffi.py /tmp/pyffi.omni | tee /tmp/pyffi2.txt
          grep -q 'verify: VerifyReport(ok' /tmp/pyffi2.txt
          grep -q "u4 \[32, 64\] packed literal" /tmp/pyffi2.txt
          grep -q 'dequantize>' /tmp/pyffi2.txt
          grep -q 'unmet: required feature .omni.tensor/expr.1' /tmp/pyffi2.txt

          # A quantized weight comes out as numbers through the binding, which
          # is the thing C0 cannot do and the reason the binding exists.
          python3 bindings/python/omni_ffi.py /tmp/pyffi.omni \
            model.layers.0.attn.q_proj.weight.bf16 | tee /tmp/pyffi3.txt
          grep -q '2048 values' /tmp/pyffi3.txt
          grep -q 'no stored bytes: bytes: indeterminate' /tmp/pyffi3.txt

          echo "Python reaches the whole implementation through the C ABI"


      # §06.9 replaces an executed Jinja string with a total language. Whether
      # that trade is affordable is an empirical question, and the roadmap's
      # Gate 2 puts a number on it — 95 % of a hub snapshot. This measures what
      # can be measured here, and the refusals are the output worth having: a
      # construct that blocks several families is a case for growing §06.9.
      - name: Jinja chat templates translate into OMNI-CT, and the rest are named
        run: |
          OMNI=reference/target/release/omni
          set +e
          "$OMNI" jinja --coverage > /tmp/cov.txt 2>&1
          rc=$?
          set -e
          cat /tmp/cov.txt
          # 3 = indeterminate: some templates did not translate, which is the
          # honest state and not a build failure.
          test "$rc" = 3
          grep -qE 'corpus: [0-9]+ of [0-9]+ translated' /tmp/cov.txt
          grep -q 'blocked by:' /tmp/cov.txt
          # The figure is a percentage of a small corpus, and the verb has to say
          # so rather than let it be read as the hub number Gate 2 asks for.
          grep -q 'not of the hub' /tmp/cov.txt
          # The single biggest blocker is a gap in §06.9's own grammar.
          grep -q 'loop\.\*' /tmp/cov.txt

          # A real template translates, and the result is OMNI-CT rather than the
          # Jinja it came from: the filter became a call.
          cat > /tmp/one.jinja <<'JINJA'
          {% for m in messages %}{{ m['role'] | upper }}{% endfor %}
          JINJA
          "$OMNI" jinja /tmp/one.jinja > /tmp/one.ct 2>&1
          cat /tmp/one.ct
          grep -q 'upper(m\["role"\])' /tmp/one.ct
          grep -q 'free variables: messages' /tmp/one.ct
          # The whole output is itself a valid template — the caveats are OMNI-CT
          # comments, so they travel with the thing they are about.
          "$OMNI" jinja /tmp/one.jinja > /tmp/one2.ct 2>&1
          cmp /tmp/one.ct /tmp/one2.ct

          # And a construct with no total form is refused by name and position,
          # with exit 3 — the template is fine Jinja; OMNI-CT is what lacks a
          # form for it.
          cat > /tmp/macro.jinja <<'JINJA'
          {% macro f() %}{% endmacro %}
          JINJA
          set +e
          "$OMNI" jinja /tmp/macro.jinja > /tmp/macro.txt 2>&1
          rc=$?
          set -e
          test "$rc" = 3
          grep -q 'macro' /tmp/macro.txt
          echo "Jinja translates where §06.9 has a form, and names the gap where it does not"

      # §12.10. Importing a pickle is the one place OMNI has to touch dangerous
      # data, and the specification's answer is a restricted unpickler rather
      # than a bigger warning. The test that matters is not that a good file
      # imports — it is that the *same* file Python happily executes is refused
      # by name, so the refusal is measured against a real payload rather than
      # an imagined one.
      - name: A PyTorch checkpoint imports, and a hostile one is refused by name
        run: |
          OMNI=reference/target/release/omni

          # A checkpoint written by Python's own pickle and zipfile, in exactly
          # the shape torch.save produces: persistent ids for storages, a
          # _rebuild_tensor_v2 per tensor, one member per storage.
          python3 - <<'PY_MK'
          import io, os, pickle, struct, sys, types, zipfile
          from collections import OrderedDict

          class FloatStorage: pass
          class HalfStorage: pass
          def _rebuild_tensor_v2(*a): raise NotImplementedError

          torch = types.ModuleType("torch")
          torch.FloatStorage, torch.HalfStorage = FloatStorage, HalfStorage
          utils = types.ModuleType("torch._utils")
          utils._rebuild_tensor_v2 = _rebuild_tensor_v2
          sys.modules["torch"], sys.modules["torch._utils"] = torch, utils
          FloatStorage.__module__ = HalfStorage.__module__ = "torch"
          _rebuild_tensor_v2.__module__ = "torch._utils"

          class Storage:
              def __init__(s, key, cls, n): s.key, s.cls, s.numel = key, cls, n
          class Tensor:
              def __init__(s, st, off, size, stride):
                  s.args = (st, off, size, stride, False, OrderedDict())
              def __reduce__(s): return (_rebuild_tensor_v2, s.args)
          class Pk(pickle.Pickler):
              def persistent_id(s, o):
                  if isinstance(o, Storage):
                      return ("storage", o.cls, o.key, "cpu", o.numel)
                  return None

          s0, s1 = Storage("0", FloatStorage, 12), Storage("1", HalfStorage, 4)
          sd = OrderedDict()
          sd["a.weight"] = Tensor(s0, 0, (2, 3), (3, 1))
          sd["b.weight"] = Tensor(s0, 6, (2, 3), (3, 1))   # a view of the same buffer
          sd["t.weight"] = Tensor(s0, 0, (3, 2), (1, 3))   # a transposed view
          sd["h.weight"] = Tensor(s1, 0, (2, 2), (2, 1))
          sd["epoch"] = 7
          sd["note"] = "trained on nothing"
          buf = io.BytesIO(); Pk(buf, protocol=2).dump(sd)
          with zipfile.ZipFile("/tmp/torch.bin", "w", zipfile.ZIP_STORED) as z:
              z.writestr("archive/data.pkl", buf.getvalue())
              z.writestr("archive/data/0",
                         b"".join(struct.pack("<f", 1.0 + i) for i in range(12)))
              z.writestr("archive/data/1",
                         b"".join(struct.pack("<H", i * 7) for i in range(4)))
              z.writestr("archive/version", "3\n")
              z.writestr("archive/byteorder", "little")
          print(f"wrote a torch-shaped checkpoint, {os.path.getsize('/tmp/torch.bin')} bytes")
          PY_MK

          "$OMNI" import pytorch /tmp/torch.bin -o /tmp/torch.omni | tee /tmp/pt.txt
          grep -q '4 verified byte-for-byte against the source' /tmp/pt.txt
          grep -q '19 symbols resolvable' /tmp/pt.txt
          # A PyTorch tensor is a view. Both facts that follow from that are
          # reported rather than flattened away.
          grep -q 'kept as a `strided` layout with explicit strides' /tmp/pt.txt
          grep -q 'shared storage' /tmp/pt.txt
          # The two non-tensor leaves are preserved, not dropped.
          grep -q '2 non-tensor leaf value(s)' /tmp/pt.txt

          "$OMNI" verify /tmp/torch.omni --level 6 | tee /tmp/ptv.txt
          grep -q '^valid' /tmp/ptv.txt
          grep -q 'V5 semantics   ✓ 4 tensors' /tmp/ptv.txt

          # The numbers, against arithmetic done here rather than against the
          # importer. `b` is elements 6..12 of the storage; `t` is the transpose
          # of the first six, which a densifying importer would get wrong.
          "$OMNI" cat /tmp/torch.omni --tensor b.weight | tee /tmp/ptb.txt
          grep -q '7.000000     8.000000     9.000000    10.000000    11.000000    12.000000' /tmp/ptb.txt
          "$OMNI" cat /tmp/torch.omni --tensor t.weight | tee /tmp/ptt.txt
          grep -q '1.000000     4.000000     2.000000     5.000000     3.000000     6.000000' /tmp/ptt.txt

          # And the refusal, measured against a payload Python really does run.
          python3 - <<'PY_EVIL'
          import io, os, pickle, zipfile
          class Evil:
              def __reduce__(self):
                  return (os.system, ("touch /tmp/PWNED",))
          buf = io.BytesIO(); pickle.Pickler(buf, protocol=2).dump({"w": Evil()})
          with zipfile.ZipFile("/tmp/evil.bin", "w", zipfile.ZIP_STORED) as z:
              z.writestr("archive/data.pkl", buf.getvalue())
              z.writestr("archive/version", "3\n")

          # First: the threat is real, not hypothetical. Python's own loader
          # runs it. If this assert ever fails, the test below proves nothing.
          if os.path.exists("/tmp/PWNED"): os.remove("/tmp/PWNED")
          pickle.loads(buf.getvalue())
          assert os.path.exists("/tmp/PWNED"), "the payload did not fire under pickle.loads"
          os.remove("/tmp/PWNED")
          print("pickle.loads executed the payload, as it always has")
          PY_EVIL

          set +e
          "$OMNI" import pytorch /tmp/evil.bin -o /tmp/evil.omni > /tmp/evil.txt 2>&1
          rc=$?
          set -e
          test "$rc" = 4                    # policy refusal, not "malformed"
          grep -q 'posix.system' /tmp/evil.txt
          grep -q 'Loading it would mean running it' /tmp/evil.txt
          if [ -e /tmp/PWNED ]; then
            echo "::error::the importer executed the payload"; exit 1
          fi
          test ! -e /tmp/evil.omni

          # The pre-1.6 format is a bare pickle, and is named rather than
          # reported as "not a ZIP".
          python3 -c "open('/tmp/legacy.pt','wb').write(bytes([0x80,2,0x8a,8]) + \
            (0x1950a86a20f9469c).to_bytes(8,'little') + b'.' + bytes(64))"
          set +e
          "$OMNI" import pytorch /tmp/legacy.pt -o /tmp/no.omni > /tmp/legacy.txt 2>&1
          rc=$?
          set -e
          test "$rc" = 3                    # indeterminate: real file, unsupported here
          grep -q 'pre-1.6' /tmp/legacy.txt

          echo "a torch checkpoint imports under §12.10, and a hostile one does not"

      # §05's central claim is that quantization is a transformation and not a
      # file type: a GPTQ or AWQ weight is `dequantize(packed_words, scheme)` and
      # needs no new mechanism. The test of that claim is not that the importer
      # runs — it is that the numbers come out right, so the fixture is built
      # from the two formats' own packing rules in Python and the dequantized
      # result is compared against Python's arithmetic, not against OMNI's.
      - name: A GPTQ and an AWQ checkpoint dequantize to the right numbers
        run: |
          OMNI=reference/target/release/omni

          python3 - <<'PY_Q'
          import json, os, struct
          # AutoAWQ's REVERSE_AWQ_PACK_ORDER: its GEMM kernel wants a word's
          # columns in the order 0 2 4 6 1 3 5 7, so a sequential unpack comes
          # out permuted and something has to undo it.
          AWQ_REVERSE = [0, 4, 1, 5, 2, 6, 3, 7]
          ROWS, COLS, GS = 32, 16, 16          # in_features, out_features, group
          GROUPS = ROWS // GS
          LAYERS = ["model.layers.0.self_attn.q_proj", "model.layers.0.mlp.down_proj"]

          def q_of(n):  return [[(i * 7 + j * 11 + n * 3) % 16 for j in range(COLS)]
                                for i in range(ROWS)]
          def z_of():   return [[5 + ((g + j) % 3) for j in range(COLS)]
                                for g in range(GROUPS)]
          # Powers of two, so every product is exact in f16 and a mismatch is a
          # real mismatch rather than rounding.
          def s_of():   return [[0.25 * (1 << ((g + j) % 3)) for j in range(COLS)]
                                for g in range(GROUPS)]

          def pack_down_in(q, bits=4):
              epw, out = 32 // bits, b""
              for r in range(len(q) // epw):
                  for j in range(len(q[0])):
                      w = 0
                      for s in range(epw):
                          w |= q[r * epw + s][j] << (bits * s)
                      out += struct.pack("<I", w)
              return out

          def pack_along_out(q, bits=4, interleave=False):
              epw, out = 32 // bits, b""
              for row in q:
                  for g in range(len(row) // epw):
                      w = 0
                      for c in range(epw):
                          slot = AWQ_REVERSE[c] if interleave else c
                          w |= row[g * epw + c] << (bits * slot)
                      out += struct.pack("<I", w)
              return out

          def write_st(path, entries):
              data, head = b"", {}
              for name, dtype, shape, payload in entries:
                  head[name] = {"dtype": dtype, "shape": shape,
                                "data_offsets": [len(data), len(data) + len(payload)]}
                  data += payload
              h = json.dumps(head).encode()
              open(path, "wb").write(struct.pack("<Q", len(h)) + h + data)

          for method in ("gptq", "awq"):
              d = f"/tmp/{method}-model"
              os.makedirs(d, exist_ok=True)
              entries = []
              for n, prefix in enumerate(LAYERS):
                  q, z, s = q_of(n), z_of(), s_of()
                  if method == "gptq":
                      qw, shape = pack_down_in(q), [ROWS // 8, COLS]
                  else:
                      qw, shape = pack_along_out(q, interleave=True), [ROWS, COLS // 8]
                  entries += [
                      (f"{prefix}.qweight", "I32", shape, qw),
                      (f"{prefix}.qzeros", "I32", [GROUPS, COLS // 8],
                       pack_along_out(z, interleave=(method == "awq"))),
                      (f"{prefix}.scales", "F16", [GROUPS, COLS],
                       b"".join(struct.pack("<e", x) for row in s for x in row)),
                      (f"{prefix}.bias", "F16", [COLS],
                       b"".join(struct.pack("<e", 0.0) for _ in range(COLS))),
                  ]
                  if method == "gptq":
                      entries.append((f"{prefix}.g_idx", "I32", [ROWS],
                                      b"".join(struct.pack("<i", i // GS)
                                               for i in range(ROWS))))
              # The tensors nobody quantized, which must survive untouched.
              entries.append(("model.norm.weight", "F16", [COLS],
                              b"".join(struct.pack("<e", 1.0) for _ in range(COLS))))
              write_st(f"{d}/model.safetensors", entries)

          json.dump({"bits": 4, "group_size": GS, "desc_act": False, "sym": True,
                     "quant_method": "gptq", "checkpoint_format": "gptq"},
                    open("/tmp/gptq-model/quantize_config.json", "w"))
          json.dump({"quantization_config": {"bits": 4, "group_size": GS,
                                             "zero_point": True, "quant_method": "awq",
                                             "version": "gemm"}},
                    open("/tmp/awq-model/config.json", "w"))

          # What the dequantized q_proj weight must be, in [out, in] order. The
          # `+1` is AutoGPTQ's original format storing each zero point one low;
          # AWQ stores them as they are. That one step is the difference §05.1's
          # closed `formula` set exists to make unambiguous.
          for method, plus in (("gptq", 1), ("awq", 0)):
              q, z, s = q_of(0), z_of(), s_of()
              want = b""
              for j in range(COLS):
                  for i in range(ROWS):
                      g = i // GS
                      want += struct.pack("<e", (q[i][j] - (z[g][j] + plus)) * s[g][j])
              open(f"/tmp/{method}-want.bin", "wb").write(want)
          print("fixtures: 2 layers x 2 formats, from the formats' own packing rules")
          PY_Q

          for m in gptq awq; do
            "$OMNI" import "$m" "/tmp/$m-model" -o "/tmp/$m.omni" | tee "/tmp/$m-imp.txt"
            # I4 for a quantized import cannot stop at byte identity: the packed
            # words are copied verbatim, so comparing them proves nothing about
            # whether they are read correctly. Both layers are dequantized whole
            # and compared. 2 layers x 32 x 16 = 1,024 elements.
            grep -q '1,024 element(s) compared against an independent' "/tmp/$m-imp.txt"
            grep -q '2 quantized, 3 tensor(s) imported unchanged' "/tmp/$m-imp.txt"
            "$OMNI" verify "/tmp/$m.omni" --level 6 | grep -q '^valid'
            # The container is expressions over the source bytes, so the packed
            # words are stored once and never expanded.
            "$OMNI" ls "/tmp/$m.omni" | grep -q Provenance
          done

          # Which zero-point convention was assumed is in the report, not in
          # someone's head (I3).
          grep -q "zero point — one added, as AutoGPTQ's QuantLinear does" /tmp/gptq-imp.txt
          grep -q 'zero point — used as stored' /tmp/awq-imp.txt
          # g_idx was checked to be the ascending grouping rather than ignored.
          grep -q 'g_idx — checked to equal i/16' /tmp/gptq-imp.txt

          # §5.3 claims a lossless round-trip for these two rows, so it is run:
          # import, export, and compare against the file that went in. Byte
          # equality of the tensors is the weaker half; the stronger one is that
          # re-importing the exported file builds the *identical* tensor table,
          # which sorting the tensors on the way out would quietly break.
          for m in gptq awq; do
            "$OMNI" export "$m" "/tmp/$m.omni" -o "/tmp/$m-back" | tee "/tmp/$m-exp.txt"
            grep -q 'lossless     the packed words are the ones that came in' \
              "/tmp/$m-exp.txt"
            python3 - "$m" <<'PY_RT'
          import json, struct, sys
          m = sys.argv[1]
          def load(p):
              raw = open(p, "rb").read()
              n = struct.unpack("<Q", raw[:8])[0]
              head = json.loads(raw[8:8 + n]); base = 8 + n
              return {k: (v["dtype"], tuple(v["shape"]),
                          raw[base + v["data_offsets"][0]:base + v["data_offsets"][1]])
                      for k, v in head.items() if k != "__metadata__"}
          a = load(f"/tmp/{m}-model/model.safetensors")
          b = load(f"/tmp/{m}-back/model.safetensors")
          missing = set(a) - set(b)
          extra = set(b) - set(a)
          assert not missing, f"{m}: lost {sorted(missing)}"
          assert not extra, f"{m}: invented {sorted(extra)}"
          bad = [k for k in a if a[k] != b[k]]
          assert not bad, f"{m}: {len(bad)} tensor(s) differ: {bad[:3]}"
          print(f"{m}: {len(a)} tensors round-tripped byte for byte")
          PY_RT
            # E4: the same object graph, not merely the same bytes.
            "$OMNI" import "$m" "/tmp/$m-back" -o "/tmp/$m-again.omni" > /dev/null
            t1=$("$OMNI" ls "/tmp/$m.omni" --full | grep TensorTable | awk '{print $1}')
            t2=$("$OMNI" ls "/tmp/$m-again.omni" --full | grep TensorTable | awk '{print $1}')
            test -n "$t1"
            test "$t1" = "$t2"
            echo "$m: re-import builds the identical tensor table $t1"
          done

          # And now the other claim: export the dequantized weights and compare
          # them with the arithmetic Python did, byte for byte.
          for m in gptq awq; do
            "$OMNI" export safetensors "/tmp/$m.omni" -o "/tmp/$m-deq.safetensors" \
              --allow-lossy > /dev/null
            python3 - "$m" <<'PY_CHECK'
          import json, struct, sys
          m = sys.argv[1]
          raw = open(f"/tmp/{m}-deq.safetensors", "rb").read()
          n = struct.unpack("<Q", raw[:8])[0]
          head = json.loads(raw[8:8 + n])
          e = head["model.layers.0.self_attn.q_proj.weight"]
          assert e["dtype"] == "F16", e["dtype"]
          assert e["shape"] == [16, 32], e["shape"]
          lo, hi = e["data_offsets"]
          got = raw[8 + n + lo:8 + n + hi]
          want = open(f"/tmp/{m}-want.bin", "rb").read()
          if got != want:
              bad = [i for i in range(0, len(want), 2) if got[i:i+2] != want[i:i+2]]
              raise SystemExit(f"{m}: {len(bad)} of {len(want)//2} elements differ, "
                               f"first at {bad[0]//2}")
          print(f"{m}: {len(want)//2} dequantized elements match Python exactly")
          PY_CHECK
          done

          # What is refused, is refused by name rather than read as the other
          # thing. Reading an AWQ qweight as GPTQ's differs by a transpose: it
          # would not fail, it would be wrong.
          set +e
          "$OMNI" import gptq /tmp/awq-model -o /tmp/wrong.omni > /tmp/cross.txt 2>&1
          rc=$?
          set -e
          test "$rc" != 0
          grep -q 'quant_method' /tmp/cross.txt

          # An unknown checkpoint format is exactly the case where guessing the
          # zero-point convention shifts every weight by one step.
          python3 -c "import json; json.dump({'bits':4,'group_size':16,\
            'quant_method':'gptq','checkpoint_format':'gptq_v9'},\
            open('/tmp/gptq-model/quantize_config.json','w'))"
          set +e
          "$OMNI" import gptq /tmp/gptq-model -o /tmp/wrong.omni > /tmp/fmt.txt 2>&1
          rc=$?
          set -e
          test "$rc" != 0
          grep -q 'gptq_v9' /tmp/fmt.txt
          # 3-bit GPTQ straddles the 32-bit word boundary, so it is not a packed
          # layout at all.
          python3 -c "import json; json.dump({'bits':3,'group_size':16,\
            'quant_method':'gptq'}, open('/tmp/gptq-model/quantize_config.json','w'))"
          set +e
          "$OMNI" import gptq /tmp/gptq-model -o /tmp/wrong.omni > /tmp/bits.txt 2>&1
          rc=$?
          set -e
          test "$rc" != 0
          grep -q 'straddle' /tmp/bits.txt
          test ! -f /tmp/wrong.omni

          echo "GPTQ and AWQ import as expressions, and dequantize to the numbers Python computes"

      # Phase 1's premise: OMNI is worth nothing if it cannot absorb the
      # existing world without losing anything. safetensors is the format with
      # the least excuse, and the capability matrix calls its round-trip
      # lossless — so the round-trip is run, against a file this repository did
      # not write.
      - name: safetensors round-trips through OMNI without losing a byte
        run: |
          OMNI=reference/target/release/omni

          # A safetensors file built from the format's own definition in Python,
          # so the fixture is not this implementation's opinion of itself.
          python3 - <<'PY_ST'
          import json, struct
          tensors, data = {}, b""
          def add(name, dtype, shape, payload):
              global data
              tensors[name] = {"dtype": dtype, "shape": shape,
                               "data_offsets": [len(data), len(data) + len(payload)]}
              data += payload
          add("model.embed_tokens.weight", "F32", [64, 8],
              b"".join(struct.pack("<f", (i % 97) * 0.125) for i in range(512)))
          add("model.layers.0.attn.q_proj.weight", "BF16", [8, 8],
              b"".join(struct.pack("<H", (i * 37) % 0x4000) for i in range(64)))
          add("model.norm.weight", "F64", [8],
              b"".join(struct.pack("<d", i / 3) for i in range(8)))
          add("position_ids", "I64", [4], b"".join(struct.pack("<q", -i) for i in range(4)))
          add("mask", "BOOL", [8], bytes([1, 0, 1, 1, 0, 0, 1, 0]))
          add("bytes", "U8", [4], bytes([0, 127, 128, 255]))
          tensors["__metadata__"] = {"format": "pt", "trained_on": "a fixture",
                                     "note": "a key with no OMNI schema"}
          h = json.dumps(tensors).encode()
          open("/tmp/src.safetensors", "wb").write(struct.pack("<Q", len(h)) + h + data)
          print(f"fixture: {len(tensors) - 1} tensors, {len(data)} bytes of payload")
          PY_ST

          # I4: the importer verifies every tensor against the source rather than
          # asserting that it copied them.
          "$OMNI" import safetensors /tmp/src.safetensors -o /tmp/imported.omni \
            | tee /tmp/imp.txt
          grep -q 'verified byte-for-byte against the source' /tmp/imp.txt
          grep -q '6 verified' /tmp/imp.txt
          # I1: nothing invented. safetensors declares no license and no
          # architecture, so neither is written.
          grep -q 'license — field omitted' /tmp/imp.txt
          grep -q 'arch.family — field omitted' /tmp/imp.txt
          # I2: the metadata keys with no schema are preserved, and named.
          grep -q '__metadata__.note — free-form key with no OMNI schema' /tmp/imp.txt
          # The result is a valid container, and it carries the report (I3).
          "$OMNI" verify /tmp/imported.omni --level 6 | grep -q '^valid'
          "$OMNI" ls /tmp/imported.omni | grep -q Provenance

          # E1: what an export would cost, without writing anything.
          set +e
          "$OMNI" export safetensors /tmp/imported.omni --plan > /tmp/plan.txt 2>&1
          rc=$?
          set -e
          # 3 = indeterminate: the export is possible but not lossless.
          test "$rc" = 3
          grep -q 'lossless     no' /tmp/plan.txt
          grep -q 'provenance' /tmp/plan.txt
          # E2: a lossy export without consent writes nothing at all. The target
          # is removed first so the check is about this run rather than about
          # whatever was in the directory.
          rm -f /tmp/nope.safetensors
          set +e
          "$OMNI" export safetensors /tmp/imported.omni -o /tmp/nope.safetensors \
            > /tmp/refuse.txt 2>&1
          rc=$?
          set -e
          test "$rc" != 0
          test ! -f /tmp/nope.safetensors
          grep -q 'allow-lossy' /tmp/refuse.txt

          "$OMNI" export safetensors /tmp/imported.omni -o /tmp/out.safetensors \
            --allow-lossy | tee /tmp/exp.txt
          # E3: the loss report travels with the artifact.
          test -f /tmp/out.safetensors.loss.json
          python3 -c "
          import json
          r = json.load(open('/tmp/out.safetensors.loss.json'))
          assert r['lossless'] is False and r['lost'], r
          assert r['tensors'] == 6, r
          print('loss report names', len(r['lost']), 'lost item(s)')"

          # The claim in the capability matrix, checked by a reader that is not
          # this implementation: every tensor identical in dtype, shape and bytes,
          # and every source metadata key recovered from where I2 kept it.
          python3 - <<'PY_CHECK'
          import json, struct
          def read(p):
              b = open(p, "rb").read()
              n = struct.unpack("<Q", b[:8])[0]
              h, d = json.loads(b[8:8 + n]), b[8 + n:]
              t = {k: (v["dtype"], tuple(v["shape"]),
                       d[v["data_offsets"][0]:v["data_offsets"][1]])
                   for k, v in h.items() if k != "__metadata__"}
              return t, h.get("__metadata__", {})
          a, ma = read("/tmp/src.safetensors")
          b, mb = read("/tmp/out.safetensors")
          assert set(a) == set(b), f"tensor sets differ: {set(a) ^ set(b)}"
          for k in a:
              assert a[k][0] == b[k][0], f"{k}: dtype {a[k][0]} -> {b[k][0]}"
              assert a[k][1] == b[k][1], f"{k}: shape {a[k][1]} -> {b[k][1]}"
              assert a[k][2] == b[k][2], f"{k}: bytes differ"
          for k, v in ma.items():
              assert mb.get(k) == v, f"__metadata__.{k} lost: {v!r} -> {mb.get(k)!r}"
          print(f"{len(a)} tensors and {len(ma)} metadata keys survived exactly")
          PY_CHECK

          # And back again: importing the export must reach the same tensor
          # objects, because the identities are the digests (§01.2).
          "$OMNI" import safetensors /tmp/out.safetensors -o /tmp/again.omni >/dev/null
          python3 - <<'PY_DIGESTS'
          import subprocess
          def blobs(p):
              out = subprocess.run(["reference/target/release/omni", "ls", p],
                                   capture_output=True, text=True, check=True).stdout
              return sorted(r.split()[0] for r in out.splitlines()[1:]
                            if r.strip() and r.split()[1] == "Blob")
          a, b = blobs("/tmp/imported.omni"), blobs("/tmp/again.omni")
          assert a == b, f"tensor object digests changed:\n{a}\n{b}"
          print(f"all {len(a)} tensor objects kept their digests through the round trip")
          PY_DIGESTS

          # A header that lies is refused rather than followed into someone
          # else's bytes. The extent is the field that matters: it is what a
          # reader would trust.
          python3 - <<'PY_BAD'
          import json, struct
          h = json.dumps({"x": {"dtype": "F32", "shape": [4],
                                "data_offsets": [0, 8]}}).encode()
          open("/tmp/bad.safetensors", "wb").write(
              struct.pack("<Q", len(h)) + h + bytes(8))
          PY_BAD
          rm -f /tmp/bad.omni
          set +e
          "$OMNI" import safetensors /tmp/bad.safetensors -o /tmp/bad.omni \
            > /tmp/bad.txt 2>&1
          rc=$?
          set -e
          test "$rc" != 0
          test ! -f /tmp/bad.omni
          grep -qi 'claims\|malformed' /tmp/bad.txt
          echo "a safetensors header that disagrees with its buffer is refused"

          # An unknown format is a refusal that says what this build does, not a
          # silent no-op.
          set +e
          "$OMNI" import gguf /tmp/src.safetensors -o /tmp/x.omni > /tmp/nofmt.txt 2>&1
          rc=$?
          set -e
          test "$rc" = 2
          grep -q 'no importer for `gguf`' /tmp/nofmt.txt

      # §13: the unit of transfer is the object. A container read over HTTP by
      # range, with the round trips counted — a transport claim nothing counts
      # is not a claim.
      - name: A container is read over HTTP by range, and every byte is checked
        run: |
          OMNI=$PWD/reference/target/release/omni
          "$OMNI" example --tune 1 /tmp/net.omni >/dev/null

          # §13.4.1: the detached index. A few kilobytes that open a container in
          # one request instead of three.
          "$OMNI" index /tmp/net.omni | tee /tmp/idx.txt
          grep -q 'opens in     1 request instead of 3' /tmp/idx.txt
          "$OMNI" index /tmp/net.omni.idx --show | grep -q 'describes    a container of'

          # A range-capable static server: the smallest thing that is honestly
          # HTTP. No fixture in the repository can stand in for this — a range
          # store that is never asked for a range is untested code.
          cat > /tmp/rangeserver.py <<'PY_SRV'
          import http.server, os, re, socketserver, sys
          ROOT = sys.argv[1]
          class H(http.server.BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"
              def log_message(self, *a): pass
              def do_GET(self):
                  path = os.path.join(ROOT, os.path.basename(self.path))
                  if not os.path.isfile(path):
                      self.send_response(404); self.send_header("Content-Length", "0")
                      self.end_headers(); return
                  data = open(path, "rb").read()
                  rng = self.headers.get("Range")
                  m = re.fullmatch(r"bytes=(\d+)-(\d+)", rng.strip()) if rng else None
                  if m:
                      a, b = int(m.group(1)), int(m.group(2))
                      if a >= len(data):
                          self.send_response(416); self.send_header("Content-Length", "0")
                          self.end_headers(); return
                      body = data[a:b + 1]
                      self.send_response(206)
                      self.send_header("Content-Range",
                                       f"bytes {a}-{a + len(body) - 1}/{len(data)}")
                  else:
                      body = data; self.send_response(200)
                  self.send_header("Accept-Ranges", "bytes")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers(); self.wfile.write(body)
          class S(socketserver.ThreadingTCPServer):
              allow_reuse_address = True
              daemon_threads = True
          with S(("127.0.0.1", 18713), H) as srv:
              srv.serve_forever()
          PY_SRV
          python3 /tmp/rangeserver.py /tmp &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for _ in $(seq 50); do
            python3 -c "
          import socket, sys
          s = socket.socket()
          sys.exit(0 if s.connect_ex(('127.0.0.1', 18713)) == 0 else 1)" && break
            sleep 0.1
          done

          # §02.7 over a stateless transport: header, front superblock, index.
          "$OMNI" fetch http://127.0.0.1:18713/net.omni | tee /tmp/f1.txt
          grep -q 'open         3 request(s)' /tmp/f1.txt
          # With the sidecar in hand, opening costs one request instead of three —
          # and that one is R-X02: confirming the file being served is the file
          # the sidecar describes, before any offset from it is trusted.
          "$OMNI" fetch http://127.0.0.1:18713/net.omni --sidecar /tmp/net.omni.idx \
            | tee /tmp/f2.txt
          grep -q 'open         1 request(s)' /tmp/f2.txt

          # R-X02: a sidecar describes one specific container. Handed one for a
          # different file, the store must refuse rather than range-read the right
          # URL at the wrong offsets — a failure that otherwise looks like
          # corruption.
          "$OMNI" example /tmp/other.omni >/dev/null
          "$OMNI" index /tmp/other.omni -o /tmp/other.idx >/dev/null
          set +e
          "$OMNI" fetch http://127.0.0.1:18713/net.omni --sidecar /tmp/other.idx \
            > /tmp/f6.txt 2>&1
          rc=$?
          set -e
          test "$rc" != 0
          grep -q 'R-X02' /tmp/f6.txt
          echo "a sidecar for another container is refused before a range is planned"

          # §13.4.2: every object, coalesced into one request, each verified
          # against its digest — and the reassembled container is byte-identical
          # to the original, because packing is reproducible (§01.10). That
          # equality is the end-to-end proof that nothing was lost or altered in
          # transit.
          "$OMNI" fetch http://127.0.0.1:18713/net.omni --sidecar /tmp/net.omni.idx \
            -o /tmp/net-copy.omni | tee /tmp/f3.txt
          grep -q 'fetch        1 request(s)' /tmp/f3.txt
          grep -q 'every object against its digest (R-O01)' /tmp/f3.txt
          cmp /tmp/net.omni /tmp/net-copy.omni
          echo "a container fetched over HTTP by range reassembles to the same bytes"

          # A tampered byte is caught, not served. The store checks what the
          # network hands it (§13.7), so flipping one byte of one object must be
          # a failure rather than a silently wrong tensor.
          python3 - <<'PY_TAMPER'
          import subprocess
          # The container's own index says where its objects are, so the byte to
          # flip is chosen rather than guessed: the largest data object, which is
          # certainly payload and not padding.
          ls = subprocess.run(['reference/target/release/omni', 'ls', '/tmp/net.omni'],
                              capture_output=True, text=True, check=True).stdout
          rows = [r.split() for r in ls.splitlines()[1:] if r.strip()]
          blobs = [(int(r[3]), int(r[2])) for r in rows if r[1] == 'Blob']
          assert blobs, ls
          size, off = max(blobs)
          raw = bytearray(open('/tmp/net.omni', 'rb').read())
          raw[off + size // 2] ^= 0xFF
          open('/tmp/net-bad.omni', 'wb').write(bytes(raw))
          print(f'flipped one byte inside a {size}-byte data object at {off}')
          PY_TAMPER
          set +e
          "$OMNI" fetch http://127.0.0.1:18713/net-bad.omni --all > /tmp/f4.txt 2>&1
          rc=$?
          set -e
          test "$rc" != 0
          grep -qi 'R-O01\|do not hash' /tmp/f4.txt
          echo "a flipped byte over the wire is refused, not decoded"

          # §13.8: the index-only container. Everything described, no weights —
          # and it is incomplete rather than invalid (§01.4), which the exit code
          # has to say.
          "$OMNI" strip /tmp/net.omni --weights -o /tmp/thin.omni | tee /tmp/thin.txt
          grep -q 'flags        PARTIAL' /tmp/thin.txt
          python3 -c "
          import os
          thin, full = os.path.getsize('/tmp/thin.omni'), os.path.getsize('/tmp/net.omni')
          assert thin < full / 2, f'{thin} is not much smaller than {full}'
          print(f'the catalogue is {thin} bytes for a {full}-byte model')"
          "$OMNI" inspect /tmp/thin.omni | grep -q 'complete      no ('
          set +e
          "$OMNI" verify /tmp/thin.omni --level 6 > /tmp/thinv.txt 2>&1
          rc=$?
          set -e
          test "$rc" = 5
          grep -q 'incomplete: valid container' /tmp/thinv.txt
          echo "an index-only container is incomplete, not invalid, and says which"

          # https is refused with its reason rather than downgraded to http.
          set +e
          "$OMNI" fetch https://example.invalid/x.omni > /tmp/f5.txt 2>&1
          rc=$?
          set -e
          test "$rc" != 0
          grep -q 'TLS' /tmp/f5.txt
          echo "https is refused with the reason, not silently downgraded"

      # §07: a model that describes its own computation, and the property no
      # other format has — an unknown high-level op recovered from a shipped
      # lowering rather than refused.
      - name: The graph is self-describing, verified, and lowerable
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" example --graph /tmp/graph.omni
          # A weights-only model says so, in the words §07.5 uses.
          "$OMNI" example /tmp/weights.omni >/dev/null
          "$OMNI" inspect /tmp/weights.omni | grep -q 'graph         none (weights-only)'
          "$OMNI" inspect /tmp/weights.omni | grep -q 'requires a runtime with built-in support'
          # And the synthesized one reports its level, dialects and size.
          "$OMNI" inspect /tmp/graph.omni | grep -q 'graph         semantic'
          # Every op type-checked against the weights it names (R-I10): the graph
          # cannot drift from the tensors, because the check is the same one a
          # reader runs.
          "$OMNI" graph /tmp/graph.omni --verify | tee /tmp/gv.txt
          grep -q '0 unchecked, 0 unknown' /tmp/gv.txt
          "$OMNI" verify /tmp/graph.omni --level 6 | grep -q 'V5 graph       ✓'
          "$OMNI" graph /tmp/graph.omni | grep -q 'omni.nn/attention@2'
          # §07.9: the same graph in the fixed-layout binary encoding, which must
          # round-trip exactly — the CLI refuses to report a size it cannot
          # reproduce the graph from.
          "$OMNI" graph /tmp/graph.omni --binary | grep -q '28 bytes per op'
          # §07.4: omni.core is frozen and embedded; a reader gets the dialect
          # definitions without fetching anything.
          "$OMNI" graph /tmp/graph.omni --dialects | grep -q 'omni.core        v1 frozen     embedded'

          # §07.2's key move: lower the shipped rules and the result is a
          # primitive-level graph that verifies on its own terms.
          "$OMNI" graph lower /tmp/graph.omni -o /tmp/lowered.omni | tee /tmp/low.txt
          grep -q 'level        semantic -> primitive' /tmp/low.txt
          grep -q 'applied      omni.nn/norm@1\[rms\]→primitive' /tmp/low.txt
          # What could not be lowered is named, not glossed over.
          grep -q 'still needed omni.nn/attention@2' /tmp/low.txt
          "$OMNI" graph /tmp/lowered.omni --verify | grep -q '0 unknown'
          # A lowered graph is derived and droppable, so V6 recomputes it from
          # its parent and compares (§07.2, §15.1).
          "$OMNI" verify /tmp/lowered.omni --level 6 | tee /tmp/lv.txt
          grep -q '2 derived object(s) recomputed, 0 mismatched' /tmp/lv.txt
          # The weights kept their identities across both rewrites: a model that
          # gains a graph is the same weights.
          python3 - <<'PY'
          import subprocess
          def tensors(path):
              out = subprocess.run(['reference/target/release/omni', 'ls', path],
                                   capture_output=True, text=True, check=True).stdout
              return sorted(l.split()[0] for l in out.splitlines()[1:]
                            if l.split()[1] == 'Blob')
          a, b, c = tensors('/tmp/weights.omni'), tensors('/tmp/graph.omni'), tensors('/tmp/lowered.omni')
          # The graph containers carry extra blobs (the shipped rewrite rules),
          # so the weights are a subset rather than the whole list.
          missing = [d for d in a if d not in b or d not in c]
          assert not missing, f"{len(missing)} weight chunk(s) changed identity"
          print(f"all {len(a)} data objects unchanged through synthesis and lowering")
          PY

          # A model with no graph is *indeterminate* for graph work, not invalid.
          expect() {
            local want=$1; shift
            local got=0
            "$@" >/dev/null 2>&1 || got=$?
            if [ "$got" != "$want" ]; then
              echo "::error::$* exited $got, expected $want"; exit 1
            fi
          }
          expect 3 "$OMNI" graph /tmp/weights.omni
          echo "the graph verifies, lowers, and says what it cannot do"

      # §10: resolution is a function of the model and the capability set, so a
      # CI job can answer "will this run on our fleet?" without the fleet.
      - name: Capability negotiation and planning
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" caps --out /tmp/caps.cbor
          "$OMNI" example --quantized /tmp/q.omni
          "$OMNI" plan /tmp/q.omni --caps /tmp/caps.cbor --objective min-memory \
            | tee /tmp/min.txt | grep -q FEASIBLE
          "$OMNI" plan /tmp/q.omni --objective max-quality | tee /tmp/max.txt | grep -q FEASIBLE
          # The two objectives must not agree: the model carries an fp8
          # realization and a bf16 one, and that is the whole point.
          if cmp -s /tmp/min.txt /tmp/max.txt; then
            echo "::error::min-memory and max-quality produced the same plan"; exit 1
          fi
          grep -q 'f8e4m3' /tmp/min.txt
          # A budget nothing fits is an informative failure with an exit code.
          set +e
          "$OMNI" plan /tmp/q.omni --memory 1000 >/tmp/tiny.txt; code=$?
          set -e
          [ "$code" = "1" ] || { echo "::error::expected infeasible (1), got $code"; exit 1; }
          grep -q 'remedy' /tmp/tiny.txt
          # Resolution is deterministic: the same inputs give the same plan key.
          a=$("$OMNI" plan /tmp/q.omni --caps /tmp/caps.cbor | awk '/plan key/ {print $3}')
          b=$("$OMNI" plan /tmp/q.omni --caps /tmp/caps.cbor | awk '/plan key/ {print $3}')
          [ "$a" = "$b" ] || { echo "::error::resolution is not deterministic"; exit 1; }
          echo "resolution is deterministic, and failure is informative"

      # §12.5: a signature is attached to the manifest it signs, and the
      # container still verifies afterwards.
      - name: Signing and V7 verification
        run: |
          OMNI=reference/target/release/omni
          SEED=$(python3 -c "print('11'*32)")
          PUB=$("$OMNI" keygen --seed $SEED | awk '/^public/ {print $2}')
          "$OMNI" example /tmp/base.omni
          "$OMNI" sign /tmp/base.omni --key $SEED -o /tmp/signed.omni
          "$OMNI" verify /tmp/signed.omni --level 6
          "$OMNI" sign --verify /tmp/signed.omni --key $PUB
          "$OMNI" inspect /tmp/signed.omni | grep -q 'signatures    1'
          # A different key must not satisfy the policy, and must not be
          # reported as invalid either: it is simply not our key.
          OTHER=$("$OMNI" keygen --seed $(python3 -c "print('22'*32)") | awk '/^public/ {print $2}')
          set +e
          "$OMNI" sign --verify /tmp/signed.omni --key $OTHER; code=$?
          set -e
          [ "$code" = "3" ] || { echo "::error::expected indeterminate (3), got $code"; exit 1; }
          # A signature covers the manifest (§12.5.2), and the manifest covers
          # everything else by content addressing. Both halves of that need
          # testing, and they fail in different places on purpose.
          MOFF=$("$OMNI" ls /tmp/signed.omni | awk '$2 == "Manifest" { print $3 }')
          python3 -c "
          import sys
          d = bytearray(open('/tmp/signed.omni','rb').read())
          d[int(sys.argv[1]) + 40] ^= 1
          open('/tmp/tampered.omni','wb').write(bytes(d))" "$MOFF"
          set +e
          "$OMNI" sign --verify /tmp/tampered.omni --key $PUB >/dev/null 2>&1; code=$?
          set -e
          [ "$code" != "0" ] || { echo "::error::a tampered manifest verified"; exit 1; }

          # Tampering with a tensor payload instead does *not* break the
          # signature, and must not be reported as if it did: the manifest is
          # still authentic. It is caught one layer down, by the object digests
          # the manifest transitively commits to.
          python3 -c "
          d = bytearray(open('/tmp/signed.omni','rb').read())
          d[20000] ^= 1
          open('/tmp/blob-tampered.omni','wb').write(bytes(d))"
          set +e
          "$OMNI" sign --verify /tmp/blob-tampered.omni --key $PUB >/dev/null 2>&1; sig=$?
          "$OMNI" verify /tmp/blob-tampered.omni >/dev/null 2>&1; full=$?
          set -e
          [ "$sig" = "0" ] || { echo "::error::the manifest is untouched; its signature should still verify (got $sig)"; exit 1; }
          [ "$full" != "0" ] || { echo "::error::a corrupted tensor payload passed full verification"; exit 1; }
          echo "signed, verified, and unforgeable at both layers"

      # §08.6: a fine-tune of a model is a delta over it, and reading the delta
      # needs the base.
      - name: Deltas and adapters
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" example --tune 0 /tmp/b.omni
          "$OMNI" example --tune 7 /tmp/t.omni
          "$OMNI" delta /tmp/b.omni /tmp/t.omni -o /tmp/d.omni --max-err 1e-2 | tee /tmp/delta.txt
          grep -q 'low-rank' /tmp/delta.txt
          # The delta must be a small fraction of the base.
          python3 - <<'PY'
          import re
          pct = float(re.search(r'\(([\d.]+) % of base\)', open('/tmp/delta.txt').read()).group(1))
          assert pct < 10.0, f"delta is {pct}% of base, expected well under 10%"
          print(f"delta is {pct}% of the base")
          PY
          # On its own the delta is incomplete (exit 5), not invalid.
          set +e
          "$OMNI" verify /tmp/d.omni >/dev/null; code=$?
          set -e
          [ "$code" = "5" ] || { echo "::error::expected incomplete (5), got $code"; exit 1; }
          # Layered with its parent, its tensors read back.
          "$OMNI" cat /tmp/d.omni --tensor model.layers.0.attn.q_proj.weight \
            --with /tmp/b.omni --limit 4
          # §08.3: an adapter is checked against a base before any weights load.
          "$OMNI" adapter make /tmp/b.omni -o /tmp/lora.omni
          "$OMNI" adapter check /tmp/b.omni /tmp/lora.omni | grep -q attachable
          echo "delta and adapter paths hold"

      - name: Both mandatory hash algorithms produce valid containers
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" example --hash sha256 /tmp/sha.omni >/dev/null
          "$OMNI" verify /tmp/sha.omni >/dev/null
          "$OMNI" inspect /tmp/sha.omni | grep -q 'hash=sha2-256'
          "$OMNI" inspect examples/toy.omni | grep -q 'hash=blake3-256'
          # Same model, same size, different identities: the algorithm is one
          # header field and nothing else about the layout depends on it.
          a=$(stat -c%s /tmp/sha.omni); b=$(stat -c%s examples/toy.omni)
          [ "$a" = "$b" ] || { echo "::error::sizes differ: $a vs $b"; exit 1; }
          cmp -s /tmp/sha.omni examples/toy.omni && \
            { echo "::error::the two containers should not be identical"; exit 1; }
          echo "blake3-256 and sha2-256 containers both valid, both $a bytes"

      # §03.7.1 marks zstd MUST. A codec is defined by somebody else's
      # bitstream, so the only test that means anything is an exchange with the
      # reference implementation — in both directions.
      - name: zstd agrees with libzstd, both ways
        run: |
          pip install --quiet zstandard
          CONF=reference/target/release/omni-conformance
          python3 - "$CONF" <<'PY'
          import subprocess, sys, random
          import zstandard as zstd

          CONF = sys.argv[1]
          random.seed(20260805)

          def noise(n):
              return bytes(random.randrange(256) for _ in range(n))

          cases = {
              "empty": b"",
              "one byte": b"z",
              "text": b"a model exists once, everything else is derived. " * 900,
              "small alphabet": bytes(random.choice(b"acgt") for _ in range(60000)),
              "incompressible": noise(70000),
              "one value": bytes(200000),
              "float plane": bytes([0x3f if i % 3 else 0x40 for i in range(60000)]),
              "duplicated": noise(90000) * 3,
              # Two blocks and change, so matches must reach across a block
              # boundary and the frame must carry more than one block.
              "multi-block": (b"the tensor is an expression. " * 12000),
          }

          bad = 0
          for name, data in cases.items():
              open('/tmp/c-in.bin', 'wb').write(data)
              # 1. We write it; libzstd must read it.
              for level in (1, 3, 9, 19):
                  r = subprocess.run([CONF, 'codec', 'zstd', 'encode', '/tmp/c-in.bin',
                                      '/tmp/c-ours.zst', '--level', str(level)],
                                     capture_output=True, text=True)
                  if r.returncode != 0:
                      print(f"::error::encode failed for {name} at level {level}: {r.stderr}")
                      bad += 1
                      continue
                  frame = open('/tmp/c-ours.zst', 'rb').read()
                  try:
                      back = zstd.ZstdDecompressor().decompress(
                          frame, max_output_size=len(data) + 1)
                  except Exception as e:
                      print(f"::error::libzstd rejected our frame for {name} at {level}: {e}")
                      bad += 1
                      continue
                  if back != data:
                      print(f"::error::libzstd decoded our frame for {name} differently")
                      bad += 1
              # 2. libzstd writes it; we must read it — at every level, with and
              #    without a checksum and a declared content size.
              for level in (1, 2, 5, 9, 12, 17, 19, 22):
                  ref = zstd.ZstdCompressor(level=level,
                                            write_checksum=(level % 2 == 0),
                                            write_content_size=(level % 3 != 0)
                                            ).compress(data)
                  open('/tmp/c-ref.zst', 'wb').write(ref)
                  r = subprocess.run([CONF, 'codec', 'zstd', 'decode', '/tmp/c-ref.zst',
                                      '/tmp/c-back.bin'], capture_output=True, text=True)
                  if r.returncode != 0:
                      print(f"::error::we rejected libzstd's frame for {name} at {level}: {r.stderr}")
                      bad += 1
                      continue
                  if open('/tmp/c-back.bin', 'rb').read() != data:
                      print(f"::error::we decoded libzstd's frame for {name} at {level} differently")
                      bad += 1
              print(f"{name}: {len(data)} B, both directions agree")
          sys.exit(1 if bad else 0)
          PY
          echo "zstd interoperates with libzstd in both directions"

      # §03.7: compression is a property of a stored copy, so changing it must
      # change no identity at all.
      - name: Compressed containers keep every digest
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" example --quantized /tmp/comp.omni >/dev/null
          "$OMNI" unpack /tmp/comp.omni -o /tmp/comp.omnid >/dev/null
          # The baseline: the same objects packed raw, from the same directory
          # store, so a raw repack has something byte-exact to be compared with.
          "$OMNI" pack /tmp/comp.omnid -o /tmp/base.omni >/dev/null
          for codec in zstd:9 bitshuffle+zstd:9:2 deflate:9; do
            "$OMNI" pack /tmp/comp.omnid -o /tmp/packed.omni --codec "$codec" >/dev/null
            "$OMNI" verify /tmp/packed.omni --level 6 >/dev/null
            "$OMNI" repack /tmp/packed.omni -o /tmp/re.omni --codec raw | tee /tmp/repack.txt
            grep -q 'every digest unchanged' /tmp/repack.txt
            # A raw repack of a compressed container must reproduce the original
            # container exactly: same objects, same order, same layout.
            cmp /tmp/re.omni /tmp/base.omni
            echo "$codec: identities survive the round trip"
          done
          # A codec this build does not implement is refused up front, not
          # half-applied.
          if "$OMNI" pack /tmp/comp.omnid -o /tmp/nope.omni --codec lz4 2>/dev/null; then
            echo "::error::pack accepted an unimplemented codec"; exit 1
          fi

      # The digests must be checkable by implementations that have nothing to do
      # with this repository, or "content-addressed" is just a claim.
      - name: Digests verify against independent implementations
        run: |
          pip install --quiet blake3
          python3 - <<'PY'
          import hashlib, struct
          import blake3 as b3

          def check(path, h, name):
              d = open(path, 'rb').read()
              assert d[:8] == bytes([0x89]) + b'OMNI\r\n\x1a', "magic"
              size = struct.unpack('<Q', d[56:64])[0]
              assert size == len(d), f"header file_size {size} != {len(d)}"
              assert d[-8:] == bytes([0x1a, 0x0a, 0x0d]) + b'INMO' + bytes([0x89]), "end magic"
              # The trailer locates the superblock; check its digest independently.
              sb_off, sb_len = struct.unpack('<QQ', d[-64:-48])
              assert h(d[sb_off:sb_off + sb_len]) == d[-48:-16], "superblock digest"
              print(f"{path}: magic, file_size, trailer and superblock digest check out ({name})")

          check('examples/toy.omni', lambda b: b3.blake3(b).digest(), 'upstream BLAKE3')
          check('/tmp/sha.omni', lambda b: hashlib.sha256(b).digest(), 'hashlib SHA-256')
          PY

  conformance-suite:
    name: conformance suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: reference
        run: cargo build --release

      # The committed corpus must be reproducible from source. A corpus of
      # opaque blobs nobody can regenerate stops being trustworthy the first
      # time someone edits one by hand.
      - name: Committed corpus matches a fresh generation
        run: |
          reference/target/release/omni-conformance generate /tmp/corpus
          if ! diff -r /tmp/corpus conformance; then
            echo "::error::the committed corpus differs from a fresh generation."
            echo "Regenerate it: reference/target/release/omni-conformance generate conformance"
            exit 1
          fi
          echo "corpus is reproducible from source"

      - name: The reference implementation passes its own suite
        run: |
          reference/target/release/omni-conformance run conformance \
            --impl reference/target/release/omni

      # Coverage-guided fuzzing needs nightly and cannot gate every push
      # (see reference/fuzz/README.md). This is the part that can: a seeded,
      # dependency-free mutator, reproducible from its seed when it fails.
      - name: Mutation fuzzing finds no crashes
        run: |
          for seed in 1 2 3; do
            reference/target/release/omni-conformance fuzz conformance \
              --iterations 400000 --seed $seed --out /tmp/fuzz-findings
          done

      - name: Upload fuzz findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: /tmp/fuzz-findings
          if-no-files-found: ignore

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Internal links resolve
        run: |
          python3 - <<'PY'
          import re, os, glob, sys
          bad = []
          for f in glob.glob('**/*.md', recursive=True):
              # A contributor who has run `npm i` or `cargo build` in the tree
              # should not be told their dependencies' READMEs have broken links.
              parts = f.split(os.sep)
              if {'node_modules', 'target', '.git'} & set(parts):
                  continue
              d = os.path.dirname(f)
              for m in re.finditer(r'\[([^\]]*)\]\(([^)#\s]+)(#[^)]*)?\)', open(f, encoding='utf-8').read()):
                  t = m.group(2)
                  if t.startswith(('http://', 'https://', 'mailto:')):
                      continue
                  if not os.path.exists(os.path.normpath(os.path.join(d, t))):
                      bad.append((f, t))
          for f, t in bad:
              print(f"::error file={f}::broken link -> {t}")
          print(f"checked links, {len(bad)} broken")
          sys.exit(1 if bad else 0)
          PY

      - name: Assets are well-formed SVG
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, glob
          for f in sorted(glob.glob('assets/*.svg')):
              ET.parse(f)
              print(f"{f} ok")
          PY

      - name: No trailing whitespace in specification text
        run: |
          if grep -rnE ' +$' --include='*.md' docs/ ; then
            echo "::error::trailing whitespace in docs"; exit 1
          fi
          echo "clean"

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: rust (${{ matrix.toolchain }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Beta is an early-warning signal for upcoming toolchain changes; it must
    # not gate the branch.
    continue-on-error: ${{ matrix.toolchain == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        toolchain: [stable, beta]
        include:
          # The container format is little-endian only (§03.9) and the parser
          # does explicit byte-order conversion, so cross-platform agreement is
          # a correctness property worth testing rather than assuming.
          - os: macos-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable
    defaults:
      run:
        working-directory: reference
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt,clippy
          rustup default ${{ matrix.toolchain }}
          rustc --version && cargo --version

      - name: Formatting
        run: cargo fmt --all --check

      # Clippy on stable only. A new lint landing in beta is a signal, not a
      # reason to block every branch in the repository.
      - name: Lint
        if: matrix.toolchain == 'stable'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all --all-features

      - name: Build (release)
        run: cargo build --release --all

  container-conformance:
    name: container conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: reference
        run: cargo build --release

      - name: Container round-trips and validates
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" --version
          "$OMNI" example /tmp/ci.omni
          "$OMNI" inspect /tmp/ci.omni
          "$OMNI" verify  /tmp/ci.omni
          "$OMNI" verify  /tmp/ci.omni --level 6

      - name: Packing is byte-reproducible (writer rule W1)
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" example /tmp/a.omni >/dev/null
          "$OMNI" example /tmp/b.omni >/dev/null
          cmp /tmp/a.omni /tmp/b.omni
          echo "two independent packs are byte-identical"

      - name: Committed example matches a fresh build
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" example /tmp/fresh.omni >/dev/null
          if ! cmp -s /tmp/fresh.omni examples/toy.omni; then
            echo "::error::examples/toy.omni differs from a fresh pack."
            echo "The container encoding changed. Regenerate it and update"
            echo "examples/README.md and docs/spec/02-container.md §2.11:"
            echo "    cd examples && ../reference/target/release/omni example toy.omni"
            sha256sum /tmp/fresh.omni examples/toy.omni
            exit 1
          fi
          echo "committed example is reproducible from source"

      # §01 axiom A5: a container and a directory are two backings for one
      # graph, so the round trip must not perturb a single byte.
      - name: Container round-trips through a directory store
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" unpack examples/toy.omni -o /tmp/toy.omnid
          "$OMNI" pack   /tmp/toy.omnid    -o /tmp/repacked.omni
          cmp /tmp/repacked.omni examples/toy.omni
          echo "container -> .omnid -> container is byte-identical"

      # §02.8: a container whose index, superblock and trailer are destroyed is
      # rebuilt by scanning. Content addressing is what makes the result
      # trustworthy rather than merely plausible.
      - name: A wrecked container is recovered exactly
        run: |
          OMNI=reference/target/release/omni
          python3 -c "
          d = bytearray(open('examples/toy.omni','rb').read())
          d[-8192:] = b'\x00' * 8192   # index + back superblock + trailer
          open('/tmp/wrecked.omni','wb').write(bytes(d))"
          if "$OMNI" verify /tmp/wrecked.omni >/dev/null 2>&1; then
            echo "::error::the wrecked file should not verify"; exit 1
          fi
          "$OMNI" fsck /tmp/wrecked.omni --rebuild -o /tmp/repaired.omni
          cmp /tmp/repaired.omni examples/toy.omni
          echo "recovered byte-identically from the undamaged original"

      - name: Corruption is detected
        run: |
          OMNI=reference/target/release/omni
          cp examples/toy.omni /tmp/bad.omni
          # Flip a bit inside the BLOB segment; verification must fail.
          printf '\x01' | dd of=/tmp/bad.omni bs=1 seek=20000 count=1 conv=notrunc status=none
          if "$OMNI" verify /tmp/bad.omni >/dev/null 2>&1; then
            echo "::error::verify accepted a corrupted container"; exit 1
          fi
          echo "corruption detected"
          # Truncation must also fail, not crash.
          head -c 40000 examples/toy.omni > /tmp/trunc.omni
          if "$OMNI" verify /tmp/trunc.omni >/dev/null 2>&1; then
            echo "::error::verify accepted a truncated container"; exit 1
          fi
          echo "truncation detected"

      # The value layer of §04-§05 is only a claim until something reads a
      # container whose tensors are expressions rather than byte ranges.
      - name: The value layer round-trips through a container
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" example --quantized /tmp/q.omni
          "$OMNI" verify /tmp/q.omni --level 6
          # Four tensors over one set of stored bytes (§04.8): the int4 weight,
          # its bf16 dequantization, the LoRA-merged bf16, and the fp8 cast.
          "$OMNI" cat /tmp/q.omni --tensor model.layers.0.attn.q_proj.weight.bf16 --limit 4
          "$OMNI" cat /tmp/q.omni --tensor model.layers.0.attn.q_proj.weight.lora --limit 4
          "$OMNI" cat /tmp/q.omni --tensor model.layers.0.attn.q_proj.weight.fp8  --limit 4
          # The derived realizations cost no storage.
          "$OMNI" inspect /tmp/q.omni | grep -q 'affine-sub-u4 g32'
          # §04.7.4: reading 64 of 2048 elements fetches 32 bytes, exactly.
          "$OMNI" deps /tmp/q.omni --tensor model.layers.0.attn.q_proj.weight.bf16 \
            --range 0:64 | grep -q 'bytes 0..32 (32 B)'
          echo "expressions evaluate, and a partial read reads only its part"

      # §06.7: a tokenizer that changed during conversion is a silent quality
      # regression everywhere else. Here it is a build failure.
      - name: The tokenizer is checked, not trusted
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" example --tokenizer /tmp/tok.omni
          "$OMNI" verify /tmp/tok.omni --tokenizer | tee /tmp/tokv.txt
          grep -q '5/5 vectors pass' /tmp/tokv.txt
          # §06.7's vocabulary/embedding agreement: a truncated conversion shows
          # up here rather than as garbage logits.
          grep -q 'vocabulary matches' /tmp/tokv.txt
          "$OMNI" inspect /tmp/tok.omni | grep -q 'tokenizer     bpe · 256 tokens'
          # An independent oracle: the ids of a byte-level tokenizer are the
          # UTF-8 bytes of the input. Computed here from the definition, not by
          # asking the encoder what it thinks.
          want=$(python3 -c "print(','.join(str(b) for b in 'Héllo, world!'.encode()))")
          got=$("$OMNI" tokenize /tmp/tok.omni --text 'Héllo, world!' | sed -n 2p)
          [ "$want" = "$got" ] || { echo "ids $got != $want"; exit 1; }
          "$OMNI" tokenize /tmp/tok.omni --text 'Héllo, world!' | grep -q '; round-trips'
          # `;` lines are comments, as in `omni cat`; the last line is the datum.
          [ "$("$OMNI" tokenize /tmp/tok.omni --ids "$want" | tail -n 1)" = 'Héllo, world!' ]
          # A container with no tokenizer is indeterminate and incomplete, never
          # "valid, no tokenizer problems" (§15.1).
          "$OMNI" example /tmp/plain.omni
          # GitHub runs `run:` blocks under `bash -e`, so a bare
          # `cmd; test $? = N` dies on cmd's non-zero exit before the assertion
          # is ever reached. Semantic exit codes have to be captured, not tested
          # after the fact.
          expect() {
            local want=$1; shift
            local got=0
            "$@" >/dev/null 2>&1 || got=$?
            if [ "$got" != "$want" ]; then
              echo "::error::$* exited $got, expected $want"; exit 1
            fi
          }
          expect 3 "$OMNI" verify /tmp/plain.omni --tokenizer
          expect 5 "$OMNI" tokenize /tmp/plain.omni --text hi
          echo "the tokenizer reproduces its own vectors, and refuses when it cannot"

      # §06.9: a chat template is the last place arbitrary code still runs in a
      # model artifact. OMNI-CT renders without a sandbox because there is
      # nothing to sandbox.
      - name: The chat template is total, and checked
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" example --chat-template /tmp/ct.omni
          "$OMNI" verify /tmp/ct.omni --template --level 6 | tee /tmp/ctv.txt
          grep -q '3/3 vectors pass' /tmp/ctv.txt
          # The cached `compiled` AST is derived, so V6 recomputes it.
          grep -q '2 derived object(s) recomputed, 0 mismatched' /tmp/ctv.txt
          # The required inputs are computable without rendering — that is what
          # a total language buys.
          [ "$("$OMNI" render /tmp/ct.omni --inputs | tail -n +2 | tr '\n' ' ')" \
            = "add_generation_prompt messages " ]
          out=$("$OMNI" render /tmp/ct.omni --message system:Hi --message user:Yo \
                  --var add_generation_prompt=true)
          [ "$out" = "$(printf '<|system|>\nHi<|end|>\n<|user|>\nYo<|end|>\n<|assistant|>')" ] \
            || { echo "rendered: $out"; exit 1; }
          # A missing input is refused with the list of what was wanted, not
          # rendered as the empty string.
          # GitHub runs `run:` blocks under `bash -e`, so a bare
          # `cmd; test $? = N` dies on cmd's non-zero exit before the assertion
          # is ever reached. Semantic exit codes have to be captured, not tested
          # after the fact.
          expect() {
            local want=$1; shift
            local got=0
            "$@" >/dev/null 2>&1 || got=$?
            if [ "$got" != "$want" ]; then
              echo "::error::$* exited $got, expected $want"; exit 1
            fi
          }
          expect 2 "$OMNI" render /tmp/ct.omni --message user:hi
          expect 5 "$OMNI" render /tmp/plain.omni --message user:hi
          expect 3 "$OMNI" verify /tmp/plain.omni --template
          "$OMNI" inspect /tmp/ct.omni | grep -q 'chat template omni-ct/1'
          echo "the template renders identically, or says why not"

      # §02.7 and §04.7.4 are claims about I/O, and an implementation that reads
      # the whole file cannot demonstrate either. This measures them.
      - name: Opening a container reads its framing, not its weights
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" open examples/toy.omni | tee /tmp/open.txt
          grep -q '4 reads' /tmp/open.txt
          # A partial read moves exactly what the plan said, and nothing else.
          "$OMNI" open examples/toy.omni --tensor model.embed_tokens.weight \
            --range 0:64 | tee /tmp/range.txt
          grep -q 'plan         1 chunk read(s), 128 B' /tmp/range.txt
          grep -q 'payload      1 reads, 128 B moved for 128 B planned' /tmp/range.txt
          python3 - <<'PY'
          import re
          txt = open('/tmp/range.txt').read()
          pct = float(re.search(r'total .*\(([\d.]+) % of the file\)', txt).group(1))
          assert pct < 10, f"reading 64 elements touched {pct} % of the file"
          print(f"64 of 16384 elements cost {pct} % of the file")
          PY

      # §09.1: training state is separable, and the rule is normative — the
      # inference artifact and the checkpoint must never be the same download.
      - name: A checkpoint separates from its own weights
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" example --training --step 127500 /tmp/ck1.omni >/dev/null
          "$OMNI" example --training --step 128000 --parent /tmp/ck1.omni /tmp/ck2.omni
          "$OMNI" verify /tmp/ck2.omni --level 6 | tee /tmp/ckv.txt
          grep -q 'V5 training    ✓' /tmp/ckv.txt
          "$OMNI" inspect /tmp/ck2.omni | tee /tmp/cki.txt
          grep -q 'training      step 128,000' /tmp/cki.txt
          grep -q 'separable' /tmp/cki.txt
          # §09.3: the promise is narrow and the report says so. This checkpoint
          # carries a stateful CPU generator, as real ones do.
          "$OMNI" verify /tmp/ck2.omni --reproducible | tee /tmp/ckr.txt
          grep -q 'not portably' /tmp/ckr.txt
          grep -q 'pytorch-cpu' /tmp/ckr.txt

          # §09.1's rule 1: stripping removes the training state by reachability
          # alone and leaves *identical tensor digests*. Checked here against the
          # digests themselves, not against sizes.
          "$OMNI" strip /tmp/ck2.omni --training -o /tmp/infer.omni | tee /tmp/strip.txt
          grep -q 'every digest unchanged' /tmp/strip.txt
          "$OMNI" verify /tmp/infer.omni --level 6 >/dev/null
          python3 - <<'PY'
          import subprocess
          def blobs(path):
              out = subprocess.run(['reference/target/release/omni', 'ls', path],
                                   capture_output=True, text=True, check=True).stdout
              return {l.split()[0] for l in out.splitlines()[1:] if l.split()[1] == 'Blob'}
          full, stripped = blobs('/tmp/ck2.omni'), blobs('/tmp/infer.omni')
          assert stripped < full, "stripping should remove objects"
          # Every object that survived is byte-identical by construction: it is
          # the same digest. What matters is that the *weights* are all there.
          plain = blobs('/tmp/weights-only.omni') if False else None
          print(f"{len(full)} -> {len(stripped)} data objects; "
                f"{len(full - stripped)} were training-only")
          assert len(full - stripped) > 0
          PY
          # The inference artifact must be much smaller: f32 moments over bf16
          # weights is the usual ratio, and this toy keeps it.
          before=$(stat -c%s /tmp/ck2.omni); after=$(stat -c%s /tmp/infer.omni)
          python3 -c "
          import sys
          before, after = $before, $after
          assert after * 3 < before, f'{after} is not much smaller than {before}'
          print(f'inference artifact is {100*after/before:.0f} % of the checkpoint')"
          # And the stripped container carries no training state at all.
          if "$OMNI" inspect /tmp/infer.omni | grep -q '^training'; then
            echo "::error::the stripped container still reports training state"; exit 1
          fi

          # §09.6: a checkpoint chain is manifests with parents[]. The second
          # checkpoint costs its own metadata, because the objects it shares with
          # the first are shared by content addressing. (In this toy the moments
          # are identical by construction, so the delta is as small as it gets.)
          "$OMNI" log /tmp/ck2.omni --with /tmp/ck1.omni | tee /tmp/log.txt
          grep -q 'step 128000' /tmp/log.txt
          grep -q 'step 127500' /tmp/log.txt
          grep -q '2 checkpoint(s)' /tmp/log.txt
          # A chain whose parent is absent is incomplete (5), not invalid.
          expect() {
            local want=$1; shift
            local got=0
            "$@" >/dev/null 2>&1 || got=$?
            if [ "$got" != "$want" ]; then
              echo "::error::$* exited $got, expected $want"; exit 1
            fi
          }
          expect 5 "$OMNI" log /tmp/ck2.omni

          # §09.4.2: resharding rewrites the map, not the tensors. 4 -> 2 is
          # free; 4 -> 8 is not, and the report says which tensors and why.
          "$OMNI" reshard /tmp/ck2.omni --mesh tp=2 -o /tmp/r2.omni | tee /tmp/r2.txt
          grep -q 'mesh         tp=4 -> tp=2' /tmp/r2.txt
          grep -q '1 tensor(s) re-expressed with no bytes moved' /tmp/r2.txt
          grep -q '0 rewritten' /tmp/r2.txt
          "$OMNI" verify /tmp/r2.omni --level 6 >/dev/null
          "$OMNI" reshard /tmp/ck2.omni --mesh tp=8 -o /tmp/r8.omni | grep -q 'rechunk'
          # A mesh that cannot divide the tensor is refused with the numbers.
          "$OMNI" reshard /tmp/ck2.omni --mesh tp=3 -o /tmp/r3.omni 2>&1 | \
            grep -q 'cannot divide evenly' || { echo "::error::expected a refusal"; exit 1; }
          expect 1 "$OMNI" reshard /tmp/ck2.omni --mesh tp=3 -o /tmp/r3.omni
          # A model with no training state is indeterminate for all of this.
          "$OMNI" example /tmp/plainmodel.omni >/dev/null
          expect 3 "$OMNI" reshard /tmp/plainmodel.omni --mesh tp=2 -o /tmp/nope.omni
          echo "the checkpoint separates, reshards, and reports what it cannot promise"

      # §11.6: WebAssembly as portable semantics. The claim is that a runtime
      # from 2076 can execute a 2026 custom op without the 2026 toolchain; the
      # testable part is that an op *this* build has never heard of computes the
      # right numbers from the module the model shipped.
      - name: A plugin op runs under the restricted profile
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" example --plugin --tune 3 /tmp/plug.omni
          "$OMNI" inspect /tmp/plug.omni | tee /tmp/plugi.txt
          grep -q 'plugins       1 embedded' /tmp/plugi.txt
          grep -q 'runnable under §11.6' /tmp/plugi.txt
          "$OMNI" plugin list /tmp/plug.omni | grep -q 'expr ops     scale'
          # The tensor's value is a plugin node with no fallback, so these numbers
          # exist only if the WebAssembly ran: scaled = base × 2.5, exactly.
          first() { awk '/^ *-?[0-9]/ { print $1; exit }'; }
          base=$("$OMNI" cat /tmp/plug.omni --tensor model.layers.0.attn.q_proj.weight \
                   --limit 1 | first)
          scaled=$("$OMNI" cat /tmp/plug.omni \
                     --tensor model.layers.0.attn.q_proj.weight.scaled \
                     --limit 1 | first)
          python3 -c "
          base, scaled = float('$base'), float('$scaled')
          # Both numbers are printed to six decimals, so the comparison is on
          # what was printed rather than on the f64s behind them.
          assert abs(scaled - base * 2.5) < 1e-6, f'{scaled} != {base} * 2.5'
          print(f'the plugin computed {base} * 2.5 = {scaled}')"
          # And V5 checks it rather than shrugging: with the module present the
          # tensor is decidable.
          "$OMNI" verify /tmp/plug.omni --level 6 | tee /tmp/plugv.txt
          grep -q '^valid' /tmp/plugv.txt

          # The profile is enforced. A module importing anything but
          # `omni_plugin/1` is refused, and a module using a forbidden proposal
          # is refused — both at load, before anything runs.
          python3 - <<'PY'
          import subprocess, pathlib
          # A module that imports from wasi: forbidden by §11.6.
          m = bytearray(b"\0asm\x01\0\0\0")
          def section(i, body):
              return bytes([i]) + bytes([len(body)]) + body
          m += section(1, bytes([1, 0x60, 0, 0]))                      # type () -> ()
          imp = bytes([1]) + bytes([4]) + b"wasi" + bytes([3]) + b"log" + bytes([0, 0])
          m += section(2, imp)
          pathlib.Path('/tmp/bad.wasm').write_bytes(bytes(m))
          r = subprocess.run(['reference/target/release/omni', 'plugin', 'run',
                              '/tmp/bad.wasm', '--export', 'log'],
                             capture_output=True, text=True)
          assert r.returncode == 1, r
          assert 'forbidden' in (r.stdout + r.stderr).lower(), r.stderr
          print("an import outside omni_plugin/1 is refused:",
                (r.stdout + r.stderr).strip().splitlines()[-1])
          PY
          echo "the plugin host runs what the model shipped, and only that"

      # §13: the unit of transfer is the object. A container read over HTTP by
      # range, with the round trips counted — a transport claim nothing counts
      # is not a claim.
      - name: A container is read over HTTP by range, and every byte is checked
        run: |
          OMNI=$PWD/reference/target/release/omni
          "$OMNI" example --tune 1 /tmp/net.omni >/dev/null

          # §13.4.1: the detached index. A few kilobytes that open a container in
          # one request instead of three.
          "$OMNI" index /tmp/net.omni | tee /tmp/idx.txt
          grep -q 'opens in     1 request instead of 3' /tmp/idx.txt
          "$OMNI" index /tmp/net.omni.idx --show | grep -q 'describes    a container of'

          # A range-capable static server: the smallest thing that is honestly
          # HTTP. No fixture in the repository can stand in for this — a range
          # store that is never asked for a range is untested code.
          cat > /tmp/rangeserver.py <<'PY_SRV'
          import http.server, os, re, socketserver, sys
          ROOT = sys.argv[1]
          class H(http.server.BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"
              def log_message(self, *a): pass
              def do_GET(self):
                  path = os.path.join(ROOT, os.path.basename(self.path))
                  if not os.path.isfile(path):
                      self.send_response(404); self.send_header("Content-Length", "0")
                      self.end_headers(); return
                  data = open(path, "rb").read()
                  rng = self.headers.get("Range")
                  m = re.fullmatch(r"bytes=(\d+)-(\d+)", rng.strip()) if rng else None
                  if m:
                      a, b = int(m.group(1)), int(m.group(2))
                      if a >= len(data):
                          self.send_response(416); self.send_header("Content-Length", "0")
                          self.end_headers(); return
                      body = data[a:b + 1]
                      self.send_response(206)
                      self.send_header("Content-Range",
                                       f"bytes {a}-{a + len(body) - 1}/{len(data)}")
                  else:
                      body = data; self.send_response(200)
                  self.send_header("Accept-Ranges", "bytes")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers(); self.wfile.write(body)
          class S(socketserver.ThreadingTCPServer):
              allow_reuse_address = True
              daemon_threads = True
          with S(("127.0.0.1", 18713), H) as srv:
              srv.serve_forever()
          PY_SRV
          python3 /tmp/rangeserver.py /tmp &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for _ in $(seq 50); do
            python3 -c "
          import socket, sys
          s = socket.socket()
          sys.exit(0 if s.connect_ex(('127.0.0.1', 18713)) == 0 else 1)" && break
            sleep 0.1
          done

          # §02.7 over a stateless transport: header, front superblock, index.
          "$OMNI" fetch http://127.0.0.1:18713/net.omni | tee /tmp/f1.txt
          grep -q 'open         3 request(s)' /tmp/f1.txt
          # With the sidecar in hand, opening costs one request instead of three —
          # and that one is R-X02: confirming the file being served is the file
          # the sidecar describes, before any offset from it is trusted.
          "$OMNI" fetch http://127.0.0.1:18713/net.omni --sidecar /tmp/net.omni.idx \
            | tee /tmp/f2.txt
          grep -q 'open         1 request(s)' /tmp/f2.txt

          # R-X02: a sidecar describes one specific container. Handed one for a
          # different file, the store must refuse rather than range-read the right
          # URL at the wrong offsets — a failure that otherwise looks like
          # corruption.
          "$OMNI" example /tmp/other.omni >/dev/null
          "$OMNI" index /tmp/other.omni -o /tmp/other.idx >/dev/null
          set +e
          "$OMNI" fetch http://127.0.0.1:18713/net.omni --sidecar /tmp/other.idx \
            > /tmp/f6.txt 2>&1
          rc=$?
          set -e
          test "$rc" != 0
          grep -q 'R-X02' /tmp/f6.txt
          echo "a sidecar for another container is refused before a range is planned"

          # §13.4.2: every object, coalesced into one request, each verified
          # against its digest — and the reassembled container is byte-identical
          # to the original, because packing is reproducible (§01.10). That
          # equality is the end-to-end proof that nothing was lost or altered in
          # transit.
          "$OMNI" fetch http://127.0.0.1:18713/net.omni --sidecar /tmp/net.omni.idx \
            -o /tmp/net-copy.omni | tee /tmp/f3.txt
          grep -q 'fetch        1 request(s)' /tmp/f3.txt
          grep -q 'every object against its digest (R-O01)' /tmp/f3.txt
          cmp /tmp/net.omni /tmp/net-copy.omni
          echo "a container fetched over HTTP by range reassembles to the same bytes"

          # A tampered byte is caught, not served. The store checks what the
          # network hands it (§13.7), so flipping one byte of one object must be
          # a failure rather than a silently wrong tensor.
          python3 - <<'PY_TAMPER'
          import subprocess
          # The container's own index says where its objects are, so the byte to
          # flip is chosen rather than guessed: the largest data object, which is
          # certainly payload and not padding.
          ls = subprocess.run(['reference/target/release/omni', 'ls', '/tmp/net.omni'],
                              capture_output=True, text=True, check=True).stdout
          rows = [r.split() for r in ls.splitlines()[1:] if r.strip()]
          blobs = [(int(r[3]), int(r[2])) for r in rows if r[1] == 'Blob']
          assert blobs, ls
          size, off = max(blobs)
          raw = bytearray(open('/tmp/net.omni', 'rb').read())
          raw[off + size // 2] ^= 0xFF
          open('/tmp/net-bad.omni', 'wb').write(bytes(raw))
          print(f'flipped one byte inside a {size}-byte data object at {off}')
          PY_TAMPER
          set +e
          "$OMNI" fetch http://127.0.0.1:18713/net-bad.omni --all > /tmp/f4.txt 2>&1
          rc=$?
          set -e
          test "$rc" != 0
          grep -qi 'R-O01\|do not hash' /tmp/f4.txt
          echo "a flipped byte over the wire is refused, not decoded"

          # §13.8: the index-only container. Everything described, no weights —
          # and it is incomplete rather than invalid (§01.4), which the exit code
          # has to say.
          "$OMNI" strip /tmp/net.omni --weights -o /tmp/thin.omni | tee /tmp/thin.txt
          grep -q 'flags        PARTIAL' /tmp/thin.txt
          python3 -c "
          import os
          thin, full = os.path.getsize('/tmp/thin.omni'), os.path.getsize('/tmp/net.omni')
          assert thin < full / 2, f'{thin} is not much smaller than {full}'
          print(f'the catalogue is {thin} bytes for a {full}-byte model')"
          "$OMNI" inspect /tmp/thin.omni | grep -q 'complete      no ('
          set +e
          "$OMNI" verify /tmp/thin.omni --level 6 > /tmp/thinv.txt 2>&1
          rc=$?
          set -e
          test "$rc" = 5
          grep -q 'incomplete: valid container' /tmp/thinv.txt
          echo "an index-only container is incomplete, not invalid, and says which"

          # https is refused with its reason rather than downgraded to http.
          set +e
          "$OMNI" fetch https://example.invalid/x.omni > /tmp/f5.txt 2>&1
          rc=$?
          set -e
          test "$rc" != 0
          grep -q 'TLS' /tmp/f5.txt
          echo "https is refused with the reason, not silently downgraded"

      # §07: a model that describes its own computation, and the property no
      # other format has — an unknown high-level op recovered from a shipped
      # lowering rather than refused.
      - name: The graph is self-describing, verified, and lowerable
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" example --graph /tmp/graph.omni
          # A weights-only model says so, in the words §07.5 uses.
          "$OMNI" example /tmp/weights.omni >/dev/null
          "$OMNI" inspect /tmp/weights.omni | grep -q 'graph         none (weights-only)'
          "$OMNI" inspect /tmp/weights.omni | grep -q 'requires a runtime with built-in support'
          # And the synthesized one reports its level, dialects and size.
          "$OMNI" inspect /tmp/graph.omni | grep -q 'graph         semantic'
          # Every op type-checked against the weights it names (R-I10): the graph
          # cannot drift from the tensors, because the check is the same one a
          # reader runs.
          "$OMNI" graph /tmp/graph.omni --verify | tee /tmp/gv.txt
          grep -q '0 unchecked, 0 unknown' /tmp/gv.txt
          "$OMNI" verify /tmp/graph.omni --level 6 | grep -q 'V5 graph       ✓'
          "$OMNI" graph /tmp/graph.omni | grep -q 'omni.nn/attention@2'
          # §07.9: the same graph in the fixed-layout binary encoding, which must
          # round-trip exactly — the CLI refuses to report a size it cannot
          # reproduce the graph from.
          "$OMNI" graph /tmp/graph.omni --binary | grep -q '28 bytes per op'
          # §07.4: omni.core is frozen and embedded; a reader gets the dialect
          # definitions without fetching anything.
          "$OMNI" graph /tmp/graph.omni --dialects | grep -q 'omni.core        v1 frozen     embedded'

          # §07.2's key move: lower the shipped rules and the result is a
          # primitive-level graph that verifies on its own terms.
          "$OMNI" graph lower /tmp/graph.omni -o /tmp/lowered.omni | tee /tmp/low.txt
          grep -q 'level        semantic -> primitive' /tmp/low.txt
          grep -q 'applied      omni.nn/norm@1\[rms\]→primitive' /tmp/low.txt
          # What could not be lowered is named, not glossed over.
          grep -q 'still needed omni.nn/attention@2' /tmp/low.txt
          "$OMNI" graph /tmp/lowered.omni --verify | grep -q '0 unknown'
          # A lowered graph is derived and droppable, so V6 recomputes it from
          # its parent and compares (§07.2, §15.1).
          "$OMNI" verify /tmp/lowered.omni --level 6 | tee /tmp/lv.txt
          grep -q '2 derived object(s) recomputed, 0 mismatched' /tmp/lv.txt
          # The weights kept their identities across both rewrites: a model that
          # gains a graph is the same weights.
          python3 - <<'PY'
          import subprocess
          def tensors(path):
              out = subprocess.run(['reference/target/release/omni', 'ls', path],
                                   capture_output=True, text=True, check=True).stdout
              return sorted(l.split()[0] for l in out.splitlines()[1:]
                            if l.split()[1] == 'Blob')
          a, b, c = tensors('/tmp/weights.omni'), tensors('/tmp/graph.omni'), tensors('/tmp/lowered.omni')
          # The graph containers carry extra blobs (the shipped rewrite rules),
          # so the weights are a subset rather than the whole list.
          missing = [d for d in a if d not in b or d not in c]
          assert not missing, f"{len(missing)} weight chunk(s) changed identity"
          print(f"all {len(a)} data objects unchanged through synthesis and lowering")
          PY

          # A model with no graph is *indeterminate* for graph work, not invalid.
          expect() {
            local want=$1; shift
            local got=0
            "$@" >/dev/null 2>&1 || got=$?
            if [ "$got" != "$want" ]; then
              echo "::error::$* exited $got, expected $want"; exit 1
            fi
          }
          expect 3 "$OMNI" graph /tmp/weights.omni
          echo "the graph verifies, lowers, and says what it cannot do"

      # §10: resolution is a function of the model and the capability set, so a
      # CI job can answer "will this run on our fleet?" without the fleet.
      - name: Capability negotiation and planning
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" caps --out /tmp/caps.cbor
          "$OMNI" example --quantized /tmp/q.omni
          "$OMNI" plan /tmp/q.omni --caps /tmp/caps.cbor --objective min-memory \
            | tee /tmp/min.txt | grep -q FEASIBLE
          "$OMNI" plan /tmp/q.omni --objective max-quality | tee /tmp/max.txt | grep -q FEASIBLE
          # The two objectives must not agree: the model carries an fp8
          # realization and a bf16 one, and that is the whole point.
          if cmp -s /tmp/min.txt /tmp/max.txt; then
            echo "::error::min-memory and max-quality produced the same plan"; exit 1
          fi
          grep -q 'f8e4m3' /tmp/min.txt
          # A budget nothing fits is an informative failure with an exit code.
          set +e
          "$OMNI" plan /tmp/q.omni --memory 1000 >/tmp/tiny.txt; code=$?
          set -e
          [ "$code" = "1" ] || { echo "::error::expected infeasible (1), got $code"; exit 1; }
          grep -q 'remedy' /tmp/tiny.txt
          # Resolution is deterministic: the same inputs give the same plan key.
          a=$("$OMNI" plan /tmp/q.omni --caps /tmp/caps.cbor | awk '/plan key/ {print $3}')
          b=$("$OMNI" plan /tmp/q.omni --caps /tmp/caps.cbor | awk '/plan key/ {print $3}')
          [ "$a" = "$b" ] || { echo "::error::resolution is not deterministic"; exit 1; }
          echo "resolution is deterministic, and failure is informative"

      # §12.5: a signature is attached to the manifest it signs, and the
      # container still verifies afterwards.
      - name: Signing and V7 verification
        run: |
          OMNI=reference/target/release/omni
          SEED=$(python3 -c "print('11'*32)")
          PUB=$("$OMNI" keygen --seed $SEED | awk '/^public/ {print $2}')
          "$OMNI" example /tmp/base.omni
          "$OMNI" sign /tmp/base.omni --key $SEED -o /tmp/signed.omni
          "$OMNI" verify /tmp/signed.omni --level 6
          "$OMNI" sign --verify /tmp/signed.omni --key $PUB
          "$OMNI" inspect /tmp/signed.omni | grep -q 'signatures    1'
          # A different key must not satisfy the policy, and must not be
          # reported as invalid either: it is simply not our key.
          OTHER=$("$OMNI" keygen --seed $(python3 -c "print('22'*32)") | awk '/^public/ {print $2}')
          set +e
          "$OMNI" sign --verify /tmp/signed.omni --key $OTHER; code=$?
          set -e
          [ "$code" = "3" ] || { echo "::error::expected indeterminate (3), got $code"; exit 1; }
          # A signature covers the manifest (§12.5.2), and the manifest covers
          # everything else by content addressing. Both halves of that need
          # testing, and they fail in different places on purpose.
          MOFF=$("$OMNI" ls /tmp/signed.omni | awk '$2 == "Manifest" { print $3 }')
          python3 -c "
          import sys
          d = bytearray(open('/tmp/signed.omni','rb').read())
          d[int(sys.argv[1]) + 40] ^= 1
          open('/tmp/tampered.omni','wb').write(bytes(d))" "$MOFF"
          set +e
          "$OMNI" sign --verify /tmp/tampered.omni --key $PUB >/dev/null 2>&1; code=$?
          set -e
          [ "$code" != "0" ] || { echo "::error::a tampered manifest verified"; exit 1; }

          # Tampering with a tensor payload instead does *not* break the
          # signature, and must not be reported as if it did: the manifest is
          # still authentic. It is caught one layer down, by the object digests
          # the manifest transitively commits to.
          python3 -c "
          d = bytearray(open('/tmp/signed.omni','rb').read())
          d[20000] ^= 1
          open('/tmp/blob-tampered.omni','wb').write(bytes(d))"
          set +e
          "$OMNI" sign --verify /tmp/blob-tampered.omni --key $PUB >/dev/null 2>&1; sig=$?
          "$OMNI" verify /tmp/blob-tampered.omni >/dev/null 2>&1; full=$?
          set -e
          [ "$sig" = "0" ] || { echo "::error::the manifest is untouched; its signature should still verify (got $sig)"; exit 1; }
          [ "$full" != "0" ] || { echo "::error::a corrupted tensor payload passed full verification"; exit 1; }
          echo "signed, verified, and unforgeable at both layers"

      # §08.6: a fine-tune of a model is a delta over it, and reading the delta
      # needs the base.
      - name: Deltas and adapters
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" example --tune 0 /tmp/b.omni
          "$OMNI" example --tune 7 /tmp/t.omni
          "$OMNI" delta /tmp/b.omni /tmp/t.omni -o /tmp/d.omni --max-err 1e-2 | tee /tmp/delta.txt
          grep -q 'low-rank' /tmp/delta.txt
          # The delta must be a small fraction of the base.
          python3 - <<'PY'
          import re
          pct = float(re.search(r'\(([\d.]+) % of base\)', open('/tmp/delta.txt').read()).group(1))
          assert pct < 10.0, f"delta is {pct}% of base, expected well under 10%"
          print(f"delta is {pct}% of the base")
          PY
          # On its own the delta is incomplete (exit 5), not invalid.
          set +e
          "$OMNI" verify /tmp/d.omni >/dev/null; code=$?
          set -e
          [ "$code" = "5" ] || { echo "::error::expected incomplete (5), got $code"; exit 1; }
          # Layered with its parent, its tensors read back.
          "$OMNI" cat /tmp/d.omni --tensor model.layers.0.attn.q_proj.weight \
            --with /tmp/b.omni --limit 4
          # §08.3: an adapter is checked against a base before any weights load.
          "$OMNI" adapter make /tmp/b.omni -o /tmp/lora.omni
          "$OMNI" adapter check /tmp/b.omni /tmp/lora.omni | grep -q attachable
          echo "delta and adapter paths hold"

      - name: Both mandatory hash algorithms produce valid containers
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" example --hash sha256 /tmp/sha.omni >/dev/null
          "$OMNI" verify /tmp/sha.omni >/dev/null
          "$OMNI" inspect /tmp/sha.omni | grep -q 'hash=sha2-256'
          "$OMNI" inspect examples/toy.omni | grep -q 'hash=blake3-256'
          # Same model, same size, different identities: the algorithm is one
          # header field and nothing else about the layout depends on it.
          a=$(stat -c%s /tmp/sha.omni); b=$(stat -c%s examples/toy.omni)
          [ "$a" = "$b" ] || { echo "::error::sizes differ: $a vs $b"; exit 1; }
          cmp -s /tmp/sha.omni examples/toy.omni && \
            { echo "::error::the two containers should not be identical"; exit 1; }
          echo "blake3-256 and sha2-256 containers both valid, both $a bytes"

      # §03.7.1 marks zstd MUST. A codec is defined by somebody else's
      # bitstream, so the only test that means anything is an exchange with the
      # reference implementation — in both directions.
      - name: zstd agrees with libzstd, both ways
        run: |
          pip install --quiet zstandard
          CONF=reference/target/release/omni-conformance
          python3 - "$CONF" <<'PY'
          import subprocess, sys, random
          import zstandard as zstd

          CONF = sys.argv[1]
          random.seed(20260805)

          def noise(n):
              return bytes(random.randrange(256) for _ in range(n))

          cases = {
              "empty": b"",
              "one byte": b"z",
              "text": b"a model exists once, everything else is derived. " * 900,
              "small alphabet": bytes(random.choice(b"acgt") for _ in range(60000)),
              "incompressible": noise(70000),
              "one value": bytes(200000),
              "float plane": bytes([0x3f if i % 3 else 0x40 for i in range(60000)]),
              "duplicated": noise(90000) * 3,
              # Two blocks and change, so matches must reach across a block
              # boundary and the frame must carry more than one block.
              "multi-block": (b"the tensor is an expression. " * 12000),
          }

          bad = 0
          for name, data in cases.items():
              open('/tmp/c-in.bin', 'wb').write(data)
              # 1. We write it; libzstd must read it.
              for level in (1, 3, 9, 19):
                  r = subprocess.run([CONF, 'codec', 'zstd', 'encode', '/tmp/c-in.bin',
                                      '/tmp/c-ours.zst', '--level', str(level)],
                                     capture_output=True, text=True)
                  if r.returncode != 0:
                      print(f"::error::encode failed for {name} at level {level}: {r.stderr}")
                      bad += 1
                      continue
                  frame = open('/tmp/c-ours.zst', 'rb').read()
                  try:
                      back = zstd.ZstdDecompressor().decompress(
                          frame, max_output_size=len(data) + 1)
                  except Exception as e:
                      print(f"::error::libzstd rejected our frame for {name} at {level}: {e}")
                      bad += 1
                      continue
                  if back != data:
                      print(f"::error::libzstd decoded our frame for {name} differently")
                      bad += 1
              # 2. libzstd writes it; we must read it — at every level, with and
              #    without a checksum and a declared content size.
              for level in (1, 2, 5, 9, 12, 17, 19, 22):
                  ref = zstd.ZstdCompressor(level=level,
                                            write_checksum=(level % 2 == 0),
                                            write_content_size=(level % 3 != 0)
                                            ).compress(data)
                  open('/tmp/c-ref.zst', 'wb').write(ref)
                  r = subprocess.run([CONF, 'codec', 'zstd', 'decode', '/tmp/c-ref.zst',
                                      '/tmp/c-back.bin'], capture_output=True, text=True)
                  if r.returncode != 0:
                      print(f"::error::we rejected libzstd's frame for {name} at {level}: {r.stderr}")
                      bad += 1
                      continue
                  if open('/tmp/c-back.bin', 'rb').read() != data:
                      print(f"::error::we decoded libzstd's frame for {name} at {level} differently")
                      bad += 1
              print(f"{name}: {len(data)} B, both directions agree")
          sys.exit(1 if bad else 0)
          PY
          echo "zstd interoperates with libzstd in both directions"

      # §03.7: compression is a property of a stored copy, so changing it must
      # change no identity at all.
      - name: Compressed containers keep every digest
        run: |
          OMNI=reference/target/release/omni
          "$OMNI" example --quantized /tmp/comp.omni >/dev/null
          "$OMNI" unpack /tmp/comp.omni -o /tmp/comp.omnid >/dev/null
          # The baseline: the same objects packed raw, from the same directory
          # store, so a raw repack has something byte-exact to be compared with.
          "$OMNI" pack /tmp/comp.omnid -o /tmp/base.omni >/dev/null
          for codec in zstd:9 bitshuffle+zstd:9:2 deflate:9; do
            "$OMNI" pack /tmp/comp.omnid -o /tmp/packed.omni --codec "$codec" >/dev/null
            "$OMNI" verify /tmp/packed.omni --level 6 >/dev/null
            "$OMNI" repack /tmp/packed.omni -o /tmp/re.omni --codec raw | tee /tmp/repack.txt
            grep -q 'every digest unchanged' /tmp/repack.txt
            # A raw repack of a compressed container must reproduce the original
            # container exactly: same objects, same order, same layout.
            cmp /tmp/re.omni /tmp/base.omni
            echo "$codec: identities survive the round trip"
          done
          # A codec this build does not implement is refused up front, not
          # half-applied.
          if "$OMNI" pack /tmp/comp.omnid -o /tmp/nope.omni --codec lz4 2>/dev/null; then
            echo "::error::pack accepted an unimplemented codec"; exit 1
          fi

      # The digests must be checkable by implementations that have nothing to do
      # with this repository, or "content-addressed" is just a claim.
      - name: Digests verify against independent implementations
        run: |
          pip install --quiet blake3
          python3 - <<'PY'
          import hashlib, struct
          import blake3 as b3

          def check(path, h, name):
              d = open(path, 'rb').read()
              assert d[:8] == bytes([0x89]) + b'OMNI\r\n\x1a', "magic"
              size = struct.unpack('<Q', d[56:64])[0]
              assert size == len(d), f"header file_size {size} != {len(d)}"
              assert d[-8:] == bytes([0x1a, 0x0a, 0x0d]) + b'INMO' + bytes([0x89]), "end magic"
              # The trailer locates the superblock; check its digest independently.
              sb_off, sb_len = struct.unpack('<QQ', d[-64:-48])
              assert h(d[sb_off:sb_off + sb_len]) == d[-48:-16], "superblock digest"
              print(f"{path}: magic, file_size, trailer and superblock digest check out ({name})")

          check('examples/toy.omni', lambda b: b3.blake3(b).digest(), 'upstream BLAKE3')
          check('/tmp/sha.omni', lambda b: hashlib.sha256(b).digest(), 'hashlib SHA-256')
          PY

  conformance-suite:
    name: conformance suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: reference
        run: cargo build --release

      # The committed corpus must be reproducible from source. A corpus of
      # opaque blobs nobody can regenerate stops being trustworthy the first
      # time someone edits one by hand.
      - name: Committed corpus matches a fresh generation
        run: |
          reference/target/release/omni-conformance generate /tmp/corpus
          if ! diff -r /tmp/corpus conformance; then
            echo "::error::the committed corpus differs from a fresh generation."
            echo "Regenerate it: reference/target/release/omni-conformance generate conformance"
            exit 1
          fi
          echo "corpus is reproducible from source"

      - name: The reference implementation passes its own suite
        run: |
          reference/target/release/omni-conformance run conformance \
            --impl reference/target/release/omni

      # Coverage-guided fuzzing needs nightly and cannot gate every push
      # (see reference/fuzz/README.md). This is the part that can: a seeded,
      # dependency-free mutator, reproducible from its seed when it fails.
      - name: Mutation fuzzing finds no crashes
        run: |
          for seed in 1 2 3; do
            reference/target/release/omni-conformance fuzz conformance \
              --iterations 400000 --seed $seed --out /tmp/fuzz-findings
          done

      - name: Upload fuzz findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: /tmp/fuzz-findings
          if-no-files-found: ignore

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Internal links resolve
        run: |
          python3 - <<'PY'
          import re, os, glob, sys
          bad = []
          for f in glob.glob('**/*.md', recursive=True):
              d = os.path.dirname(f)
              for m in re.finditer(r'\[([^\]]*)\]\(([^)#\s]+)(#[^)]*)?\)', open(f, encoding='utf-8').read()):
                  t = m.group(2)
                  if t.startswith(('http://', 'https://', 'mailto:')):
                      continue
                  if not os.path.exists(os.path.normpath(os.path.join(d, t))):
                      bad.append((f, t))
          for f, t in bad:
              print(f"::error file={f}::broken link -> {t}")
          print(f"checked links, {len(bad)} broken")
          sys.exit(1 if bad else 0)
          PY

      - name: Assets are well-formed SVG
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, glob
          for f in sorted(glob.glob('assets/*.svg')):
              ET.parse(f)
              print(f"{f} ok")
          PY

      - name: No trailing whitespace in specification text
        run: |
          if grep -rnE ' +$' --include='*.md' docs/ ; then
            echo "::error::trailing whitespace in docs"; exit 1
          fi
          echo "clean"
